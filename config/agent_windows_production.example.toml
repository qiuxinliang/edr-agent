# Windows production profile.
# Copy to C:\ProgramData\EDR Agent\agent.toml, then enroll/replace server and agent values.

[server]
address              = "edr.example.com:50051"
grpc_insecure        = false
ca_cert              = "C:\\ProgramData\\EDR Agent\\certs\\ca.pem"
client_cert          = "C:\\ProgramData\\EDR Agent\\certs\\client.pem"
client_key           = "C:\\ProgramData\\EDR Agent\\certs\\client-key.pem"
connect_timeout_s    = 10
keepalive_interval_s = 30

[agent]
endpoint_id          = "auto"
tenant_id            = "tenant_default"

[platform]
rest_base_url        = "https://edr.example.com/api/v1"

[collection]
etw_enabled          = true
ebpf_enabled         = false
poll_interval_s      = 1
max_event_queue_size = 8192
etw_dns_client_provider = true
etw_powershell_provider = true
etw_security_audit_provider = true
etw_wmi_provider = true
etw_tcpip_provider = true
etw_firewall_provider = true

[preprocessing]
dedup_window_s       = 60
high_freq_threshold  = 40
sampling_rate_whitelist = 0.03
rules_version        = "edr-dynamic-rules-v1"

[ave]
model_dir            = "C:\\ProgramData\\EDR Agent\\models"
scan_threads         = 1
max_file_size_mb     = 256
sensitivity          = "MEDIUM"
behavior_monitor_enabled = true

[upload]
batch_max_events     = 200
batch_max_size_mb    = 2
batch_timeout_s      = 2
max_upload_mbps      = 4

[offline]
queue_db_path        = "C:\\ProgramData\\EDR Agent\\queue\\edr_queue.db"
max_queue_size_mb    = 512
retention_hours      = 72
evidence_cache_path  = "C:\\ProgramData\\EDR Agent\\evidence\\evidence_cache.db"
evidence_cache_max_size_mb = 512
evidence_cache_retention_hours = 72

[resource_limit]
cpu_limit_percent    = 10
memory_limit_mb      = 512
emergency_cpu_limit  = 25

[logging]
level                = "info"
log_dir              = "C:\\ProgramData\\EDR Agent\\logs"
max_log_size_mb      = 50
max_log_files        = 5

[command]
allow_dangerous      = false

[self_protect]
anti_debug           = true
job_object_windows   = true
watchdog_log_interval_s = 60
event_bus_pressure_warn_pct = 80

[attack_surface]
enabled              = true
tick_interval_s      = 300

[shellcode_detector]
enabled              = false

[webshell_detector]
enabled              = false
