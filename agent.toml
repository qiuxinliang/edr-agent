[server]
address              = "192.168.1.10:50051"
grpc_insecure        = false
ca_cert              = "C:\\Program Files\\EDR Agent\\certs\\ca.pem"
client_cert          = "C:\\Program Files\\EDR Agent\\certs\\client.pem"
client_key           = "C:\\Program Files\\EDR Agent\\certs\\client-key.pem"
connect_timeout_s    = 10
keepalive_interval_s = 30

[agent]
endpoint_id          = "ep-1034b1b3efa151f827915be41eba37b3"
tenant_id            = "demo-tenant"

[collection]
etw_enabled          = false
ebpf_enabled         = false
poll_interval_s      = 1
max_event_queue_size = 4096

[platform]
rest_base_url        = "https://127.0.0.1:8443/api/v1"
rest_user_id         = "edr-agent"

[attack_surface]
enabled              = false
port_interval_s          = 300
conn_interval_s          = 300
service_interval_s       = 600
policy_interval_s        = 3600
full_snapshot_interval_s = 1800
outbound_top_n           = 128
outbound_exclude_loopback = true
high_risk_immediate_ports = [23, 445, 3389, 6379, 27017, 1433, 3306]
firewall_rule_detail_max = 500

[offline]
queue_db_path        = "C:\\Program Files\\EDR Agent\\queue\\edr_queue.db"
max_queue_size_mb    = 128
retention_hours      = 72
evidence_cache_path  = "C:\\Program Files\\EDR Agent\\evidence\\local_evidence_cache.db"
evidence_cache_max_size_mb = 128
evidence_cache_retention_hours = 72

[resource_limit]
profile              = "workstation"
cpu_limit_percent    = 1
memory_limit_mb      = 100
emergency_cpu_limit  = 5
ave_infer_per_min    = 120
behavior_infer_per_min = 30
pmfe_scans_per_min   = 3
webshell_scan_mb_per_min = 64
shellcode_packets_per_sec = 2000
low_priority_keep_percent_under_pressure = 5

[command]
# Admin 可手动启用高危命令（rm / shutdown / reboot ...）
allow_dangerous = false

[shell]
allow = [
  "whoami", "hostname", "systeminfo", "uname",
  "tasklist", "ps", "top",
  "netstat", "ss", "lsof",
  "dir", "ls", "cat", "type", "find", "grep",
  "net", "sc", "reg", "wmic",
  "ipconfig", "ifconfig", "route", "arp",
  "df", "du", "free", "mount",
  "last", "w", "users",
  "crontab", "schtasks",
  "systemctl", "service",
  "docker", "kubectl",
  "cmd", "powershell", "bash", "sh",
]
block = [
  "rm ", "del ", "erase ", "rmdir ", "rd ",
  "format ", "fdisk ",
  "shutdown", "reboot", "halt", "poweroff", "logoff",
]

[logging]
level                = "debug"
log_dir              = "C:\\Program Files\\EDR Agent\\logs"
max_log_size_mb      = 50
max_log_files        = 5

# §17 协议层 Shellcode 检测（Windows；需管理员 + WinDivert 驱动）。默认关闭。
# 部署约定：WinDivert.dll 位于 %SystemRoot%\System32（驱动一般在 System32\drivers）；详见 README §17。
[shellcode_detector]
enabled                  = false
windivert_priority       = -1000
max_payload_inspect      = 16384
alert_threshold          = 0.70
auto_isolate_threshold   = 0.95
auto_isolate_execute     = false
heuristic_score_scale    = 1.0
yara_rules_reload_interval_s = 0
monitor_smb              = true
monitor_rdp              = true
monitor_winrm            = true
monitor_msrpc            = true
monitor_ldap             = true
detector_threads         = 2
yara_rules_dir           = ""
forensic_dir             = ""
forensic_save_pcap       = false
evidence_preview_bytes   = 0
forensic_ring_slots      = 0
forensic_ring_max_packet_bytes = 2048
windivert_tcp_ports      = ""
#   空 = 内置 SMB/RDP/WinRM/MSRPC/LDAP 等端口；非空 = 仅监听所列 TCP 端口（逗号分隔），并忽略 monitor_smb 等按类开关

# §18 Webshell 检测引擎（Linux 当前支持 inotify 目录监控；可通过 EDR_WEBSHELL_ROOTS 指定站点根目录）
[webshell_detector]
enabled                  = false
discovery_interval_s     = 1800
iis_config_path          = ""
max_watch_dirs           = 64
monitor_subdirs          = true
webshell_rules_dir       = "src/webshell_detector/rules"
scan_threads             = 2
max_file_size_mb         = 10
defer_retry_ms           = 1000
alert_threshold          = 0.50
l2_review_threshold      = 0.80
upload_webshell_files    = true
upload_timeout_s         = 60
max_upload_size_mb       = 10

# =========================
# [detection] 检测引擎自适应策略
# 控制 shellcode / webshell / PMFE 的启停模式。
# =========================
[detection]
# Agent 启动时探测环境（端口/服务）并按策略自动启用引擎
auto_profile = true
# shellcode 检测: 0=强制关 1=强制开 -1=自适应（保守探测）
shellcode_mode = 0
# webshell 检测: 0=强制关 1=强制开 -1=自适应（Web 根目录/IIS 配置探测）
webshell_mode = 0
# PMFE 内存取证: 0=强制关 1=仅空闲扫描 2=关键告警触发单进程扫描 -1=自适应关键告警触发
pmfe_mode = 2

# =========================
# [pmfe] PMFE 空闲内存取证扫描
# 在 CPU 空闲时针对有网络活动的系统服务进程做 VAD 深度扫描。
# =========================
[pmfe]
# 启用空闲扫描
idle_scan_enabled = false
# 扫描间隔（分钟）
idle_scan_interval_min = 15
# 单轮最多扫描进程数
idle_scan_max_procs = 8
# CPU 低于此百分比才启动扫描
idle_cpu_threshold = 15.0
# 笔记本电池模式跳过
idle_skip_on_battery = true

# =========================
# [forensic_auto] 取证自动触发策略
# 默认关闭；由运维中心策略下发后启用。
# =========================
[forensic_auto]
enabled = false
cooldown_s = 30
max_per_hour = 20
max_concurrent = 2
per_mitre_cooldown_s = 300
trigger_on_p0 = true
trigger_on_detection = true
collect_process_tree = true
collect_network_state = true
collect_autoruns = true
collector_timeout_s = 300
collector_output_dir = ""
collector_upload_url = ""
trigger_on_mitre = ["T1059", "T1547", "T1543", "T1003"]
