[server]
address              = "192.168.1.10:50051"
grpc_insecure        = true
ca_cert              = ""
client_cert          = ""
client_key           = ""
connect_timeout_s    = 10
keepalive_interval_s = 30

[agent]
endpoint_id          = "ep-1034b1b3efa151f827915be41eba37b3"
tenant_id            = "demo-tenant"

[collection]
etw_enabled          = false
ebpf_enabled         = false
poll_interval_s      = 1
max_event_queue_size = 4096

[platform]
rest_base_url        = "http://192.168.1.10:8080/api/v1"
rest_user_id         = "edr-agent"

[attack_surface]
enabled              = false
port_interval_s          = 300
conn_interval_s          = 300
service_interval_s       = 600
policy_interval_s        = 3600
full_snapshot_interval_s = 1800
outbound_top_n           = 128
outbound_exclude_loopback = true
high_risk_immediate_ports = [23, 445, 3389, 6379, 27017, 1433, 3306]
firewall_rule_detail_max = 500

[offline]
queue_db_path        = "edr_queue.db"
max_queue_size_mb    = 128
retention_hours      = 72

[command]
allow_dangerous      = true

[logging]
level                = "debug"
log_dir              = "."
max_log_size_mb      = 50
max_log_files        = 5

# §17 协议层 Shellcode 检测（Windows；需管理员 + WinDivert 驱动）。默认关闭。
# 部署约定：WinDivert.dll 位于 %SystemRoot%\System32（驱动一般在 System32\drivers）；详见 README §17。
[shellcode_detector]
enabled                  = false
windivert_priority       = -1000
max_payload_inspect      = 16384
alert_threshold          = 0.70
auto_isolate_threshold   = 0.95
auto_isolate_execute     = false
heuristic_score_scale    = 1.0
yara_rules_reload_interval_s = 0
monitor_smb              = true
monitor_rdp              = true
monitor_winrm            = true
monitor_msrpc            = true
monitor_ldap             = true
detector_threads         = 2
yara_rules_dir           = ""
forensic_dir             = ""
forensic_save_pcap       = false
evidence_preview_bytes   = 0
forensic_ring_slots      = 0
forensic_ring_max_packet_bytes = 2048
windivert_tcp_ports      = ""
#   空 = 内置 SMB/RDP/WinRM/MSRPC/LDAP 等端口；非空 = 仅监听所列 TCP 端口（逗号分隔），并忽略 monitor_smb 等按类开关

# §18 Webshell 检测引擎（Linux 当前支持 inotify 目录监控；可通过 EDR_WEBSHELL_ROOTS 指定站点根目录）
[webshell_detector]
enabled                  = false
discovery_interval_s     = 1800
iis_config_path          = ""
max_watch_dirs           = 64
monitor_subdirs          = true
webshell_rules_dir       = "src/webshell_detector/rules"
scan_threads             = 2
max_file_size_mb         = 10
defer_retry_ms           = 1000
alert_threshold          = 0.50
l2_review_threshold      = 0.80
upload_webshell_files    = true
upload_timeout_s         = 60
max_upload_size_mb       = 10

# =========================
# [detection] 检测引擎自适应策略
# 控制 shellcode / webshell / PMFE 的启停模式。
# =========================
[detection]
# Agent 启动时探测环境（端口/服务）并按策略自动启用引擎
auto_profile = true
# shellcode 检测: 0=关 1=开（默认 0）
shellcode_mode = 0
# webshell 检测: 0=关 1=开（默认 0）
webshell_mode = 0
# PMFE 内存取证: 0=关 1=仅空闲扫描 (默认 0)
pmfe_mode = 0

# =========================
# [pmfe] PMFE 空闲内存取证扫描
# 在 CPU 空闲时针对有网络活动的系统服务进程做 VAD 深度扫描。
# =========================
[pmfe]
# 启用空闲扫描
idle_scan_enabled = false
# 扫描间隔（分钟）
idle_scan_interval_min = 15
# 单轮最多扫描进程数
idle_scan_max_procs = 8
# CPU 低于此百分比才启动扫描
idle_cpu_threshold = 15.0
# 笔记本电池模式跳过
idle_skip_on_battery = true
