name: Private USB signing bridge
on:
  workflow_call:
    inputs:
      phase:
        required: true
        type: string
      version:
        required: true
        type: string
    secrets:
      USB_SIGNING_TOKEN:
        required: true
permissions:
  contents: read
  actions: read
jobs:
  sign:
    # The public repository never schedules work on the USB host.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/win_'))
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      USB_PHASE: ${{ inputs.phase }}
      USB_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Dispatch private signing and await verified completion
        id: private
        env:
          GH_TOKEN: ${{ secrets.USB_SIGNING_TOKEN }}
        run: |
          python3 scripts/private_signing_bridge.py dispatch \
            --run "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --commit "$GITHUB_SHA" \
            --version "${USB_VERSION#win_}" --phase "$USB_PHASE"
      - name: Retrieve the request-bound signed response
        uses: actions/download-artifact@v4
        with:
          repository: qiuxinliang/edr-agent-signing
          run-id: ${{ steps.private.outputs.signing_run_id }}
          github-token: ${{ secrets.USB_SIGNING_TOKEN }}
          name: usb-${{ inputs.phase }}-response
          path: response
      - name: Return to hosted assembly and existing signature/hash gates
        uses: actions/upload-artifact@v4
        with:
          name: usb-${{ inputs.phase }}-response
          path: response/
          if-no-files-found: error
          retention-days: 3
