# 手动触发：编译 vcpkg 依赖 → 归档为 .7z → 发布到 GitHub Release 作为预编译包。
# 后续 CI build/release workflow 在缓存未命中时会从 GitHub Release 下载预编译包，跳过源码编译。

name: Build Pre-built vcpkg Packages

on:
  workflow_dispatch:
  # Seed immutable dependency closures before a release tag is created. The
  # Windows build/release workflows still have a bounded source fallback for
  # the small race where a release starts before this job completes.
  push:
    branches:
      - main
    paths:
      - vcpkg.json
      - .github/workflows/edr-agent-prebuild-packages.yml

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  VCPKG_DOWNLOADS: ${{ github.workspace }}/.cache/vcpkg-downloads
  VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/.cache/vcpkg-bincache,readwrite"

jobs:
  prebuild:
    name: Prebuild vcpkg ${{ matrix.triplet }} → GitHub Release
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      # A cold cache is the only path that contacts GitHub source archives.
      # Do not let AMD64 and ARM64 multiply that request burst.
      max-parallel: 1
      matrix:
        include:
          - triplet: x64-windows
            runner: windows-2022
            msvc_arch: x64
          - triplet: arm64-windows
            runner: windows-11-arm
            msvc_arch: arm64
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_DEFAULT_TRIPLET: ${{ matrix.triplet }}
    steps:
      - uses: actions/checkout@v6

      - name: Initialize pinned Visual Studio 2022 environment
        shell: pwsh
        run: .\scripts\Initialize-VS2022Environment.ps1 -Architecture '${{ matrix.msvc_arch }}'

      - name: Compute vcpkg.json hash (for release tag)
        shell: pwsh
        run: |
          $hash = (Get-FileHash vcpkg.json -Algorithm SHA256).Hash
          $short = $hash.Substring(0, 12)
          Write-Host "vcpkg.json SHA256: $hash"
          Write-Host "Short hash: $short"
          "VCPKG_JSON_SHA256=$hash" | Out-File -FilePath $env:GITHUB_ENV -Append
          "VCPKG_JSON_SHORT=$short" | Out-File -FilePath $env:GITHUB_ENV -Append
          "PREBUILD_RELEASE_TAG=prebuild-yara-$env:VCPKG_DEFAULT_TRIPLET-$short" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Prepare cache directories
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path (Join-Path $env:GITHUB_WORKSPACE '.cache/vcpkg-downloads') | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $env:GITHUB_WORKSPACE '.cache/vcpkg-bincache') | Out-Null

      - name: Cache vcpkg source and binary downloads
        uses: actions/cache@v5
        with:
          path: |
            .cache/vcpkg-downloads
            .cache/vcpkg-bincache
          key: vcpkg-prebuild-yara-${{ matrix.triplet }}-${{ hashFiles('vcpkg.json') }}-${{ runner.os }}
          restore-keys: |
            vcpkg-prebuild-yara-${{ matrix.triplet }}-

      - name: Bootstrap pinned vcpkg
        working-directory: ${{ github.workspace }}
        shell: pwsh
        run: .\scripts\bootstrap_pinned_vcpkg.ps1

      - name: vcpkg install (source build)
        working-directory: ${{ github.workspace }}
        shell: pwsh
        run: |
          if (-not (Test-Path "vcpkg.json")) { throw "missing vcpkg.json" }
          $vroot = (Join-Path $env:GITHUB_WORKSPACE "vcpkg")
          $env:VCPKG_ROOT = $vroot
          $env:Path = $vroot + ";" + $env:Path
          $tc = Join-Path $vroot "vcpkg.exe"
          if (-not (Test-Path -LiteralPath $tc)) { throw "missing vcpkg.exe" }
          Write-Host "[Prebuild] Installing production vcpkg packages from source for $env:VCPKG_DEFAULT_TRIPLET..."
          & .\scripts\Invoke-VcpkgInstallWithRetry.ps1 -VcpkgExe $tc -FeatureArgs @('--x-feature=sqlite', '--x-feature=yara') -MaxAttempts 6 -InitialBackoffSeconds 30
          Write-Host "[Prebuild] vcpkg install completed successfully"

      - name: Archive vcpkg_installed (7z)
        shell: pwsh
        run: |
          $archive = "vcpkg-installed-$env:VCPKG_DEFAULT_TRIPLET.7z"
          $size_before = (Get-ChildItem -Path "vcpkg_installed" -Recurse -File | Measure-Object -Property Length -Sum).Sum
          Write-Host "vcpkg_installed size before compression: $([math]::Round($size_before / 1MB, 1)) MB"
          7z a -mx=9 -mmt=on $archive "vcpkg_installed\"
          if ($LASTEXITCODE -ne 0) { throw "7z archive failed" }
          $size_after = (Get-Item $archive).Length
          Write-Host "Archive size: $([math]::Round($size_after / 1MB, 1)) MB"
          "PREBUILD_ARCHIVE=$archive" | Out-File -FilePath $env:GITHUB_ENV -Append
          "PREBUILD_ARCHIVE_SIZE=$size_after" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Create/Update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:PREBUILD_RELEASE_TAG
          $archive = $env:PREBUILD_ARCHIVE
          # Delete existing release + tag if present
          try {
            gh release delete $tag --yes --cleanup-tag 2>$null
            Write-Host "Deleted existing release: $tag"
          } catch {
            Write-Host "No existing release $tag to delete (OK)"
          }
          # Recreate
          $now = (Get-Date).ToString('yyyy-MM-dd HH:mm:ss UTC')
          $packages = "curl, openssl, yara, pcre2, sqlite3"
          $notes = @"
          vcpkg.json SHA256: $env:VCPKG_JSON_SHA256
          Platform: $env:VCPKG_DEFAULT_TRIPLET
          Profile: production-yara
          Created: $now
          Packages: $packages
          "@
          gh release create $tag $archive `
            --title "Pre-built vcpkg packages ($env:VCPKG_DEFAULT_TRIPLET, production-yara)" `
            --notes $notes
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed" }
          Write-Host "Release created: $tag"

      - name: "[Prebuild] Summary"
        shell: pwsh
        run: |
          Write-Host "========================================"
          Write-Host "Pre-built packages published:"
          Write-Host "  Release tag : $env:PREBUILD_RELEASE_TAG"
          Write-Host "  vcpkg hash  : $env:VCPKG_JSON_SHA256"
          Write-Host "  Archive size: $([math]::Round([long]$env:PREBUILD_ARCHIVE_SIZE / 1MB, 1)) MB"
          Write-Host "========================================"
