# Seed create-only, toolchain-bound binary/download caches across release tags.
# Consumers always run vcpkg install to validate ABI; installed trees are never shared.

name: Build Pre-built vcpkg Packages

on:
  workflow_dispatch:
  # Seed toolchain-bound dependency closures before a release tag is created. The
  # Windows build/release workflows still have a bounded source fallback for
  # the small race where a release starts before this job completes.
  push:
    branches:
      - main
    paths:
      - vcpkg.json
      - dependencies.lock.json
      - scripts/vcpkg_release_cache.py
      - scripts/Invoke-VcpkgInstallWithRetry.ps1
      - scripts/vcpkg_cache_key.py
      - scripts/Initialize-VSEnvironment.ps1
      - scripts/bootstrap_pinned_vcpkg.ps1
      - vcpkg-configuration.json
      - triplets/arm64-windows.cmake
      - .github/workflows/edr-agent-prebuild-packages.yml

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  VCPKG_DOWNLOADS: ${{ github.workspace }}/.cache/vcpkg-downloads
  VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/.cache/vcpkg-bincache,readwrite"

jobs:
  prebuild:
    name: Prebuild vcpkg ${{ matrix.triplet }} → GitHub Release
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      # Triplet-specific runners, cache keys, and toolchain-bound release tags make
      # the two dependency closures independent.  Source fallback remains
      # protected by bounded download retries without weakening verification.
      max-parallel: 2
      matrix:
        include:
          - triplet: x64-windows
            runner: windows-2022
            msvc_arch: x64
          - triplet: arm64-windows
            runner: windows-11-vs2026-arm
            msvc_arch: arm64
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_DEFAULT_TRIPLET: ${{ matrix.triplet }}
    steps:
      - uses: actions/checkout@v6

      # Seed on main/default branch so subsequent release tags can restore it.
      # Tag-local caches alone are not visible to a different release tag.
      - name: Restore pinned ARM64-host Python tool cache
        if: matrix.msvc_arch == 'arm64'
        id: python-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ${{ runner.tool_cache }}/Python/3.12.10/x64
            ${{ runner.tool_cache }}/Python/3.12.10/x64.complete
          key: python-tool-${{ runner.os }}-${{ runner.arch }}-3.12.10-x64-v1
      - name: Set up pinned Python for release tools
        if: matrix.msvc_arch == 'arm64'
        uses: actions/setup-python@v6
        with:
          python-version: '3.12.10'
          architecture: x64
      - name: Save pinned ARM64-host Python tool cache
        if: matrix.msvc_arch == 'arm64' && steps.python-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            ${{ runner.tool_cache }}/Python/3.12.10/x64
            ${{ runner.tool_cache }}/Python/3.12.10/x64.complete
          key: ${{ steps.python-cache.outputs.cache-primary-key }}

      - name: Initialize pinned Visual Studio environment
        shell: pwsh
        run: .\scripts\Initialize-VSEnvironment.ps1 -Architecture '${{ matrix.msvc_arch }}'

      - name: Prepare cache directories
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path (Join-Path $env:GITHUB_WORKSPACE '.cache/vcpkg-downloads') | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $env:GITHUB_WORKSPACE '.cache/vcpkg-bincache') | Out-Null

      - name: Identify vcpkg cache toolchain
        id: vcpkg-key
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p 'test_vcpkg_*cache*.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'vcpkg cache regression failed' }
          & .\tests\test_vcpkg_install_retry.ps1
          & .\tests\test_vs_host_architecture.ps1
          python .\scripts\vcpkg_cache_key.py --triplet '${{ matrix.triplet }}'
      - name: Cache vcpkg source and binary downloads
        id: vcpkg-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            .cache/vcpkg-downloads
            .cache/vcpkg-bincache
          key: ${{ steps.vcpkg-key.outputs.key }}
          restore-keys: |
            ${{ steps.vcpkg-key.outputs.restore-prefix }}
            vcpkg-prebuild-yara-${{ matrix.triplet }}-
            vcpkg-${{ matrix.triplet }}-release-yara-fast-nogrpc-

      - name: Restore shared vcpkg dependency cache
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python .\scripts\vcpkg_release_cache.py restore --key '${{ steps.vcpkg-key.outputs.key }}' --actions-cache-hit '${{ steps.vcpkg-cache.outputs.cache-hit }}'
          if ($LASTEXITCODE -ne 0) { throw 'Shared dependency cache restore failed' }

      - name: Bootstrap pinned vcpkg
        working-directory: ${{ github.workspace }}
        shell: pwsh
        run: .\scripts\bootstrap_pinned_vcpkg.ps1

      - name: vcpkg install (source build)
        working-directory: ${{ github.workspace }}
        shell: pwsh
        run: |
          if (-not (Test-Path "vcpkg.json")) { throw "missing vcpkg.json" }
          $vroot = (Join-Path $env:GITHUB_WORKSPACE "vcpkg")
          $env:VCPKG_ROOT = $vroot
          $env:Path = $vroot + ";" + $env:Path
          $tc = Join-Path $vroot "vcpkg.exe"
          if (-not (Test-Path -LiteralPath $tc)) { throw "missing vcpkg.exe" }
          Write-Host "[Prebuild] Installing production vcpkg packages from source for $env:VCPKG_DEFAULT_TRIPLET..."
          & .\scripts\Invoke-VcpkgInstallWithRetry.ps1 -VcpkgExe $tc -FeatureArgs @('--x-feature=sqlite', '--x-feature=yara') -MaxAttempts 6 -InitialBackoffSeconds 30
          Write-Host "[Prebuild] vcpkg install completed successfully"

      - name: Save completed vcpkg dependencies
        if: steps.vcpkg-cache.outputs.cache-hit != 'true' && hashFiles('.cache/vcpkg-bincache/**/*.zip') != ''
        uses: actions/cache/save@v5
        with:
          path: |
            .cache/vcpkg-downloads
            .cache/vcpkg-bincache
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Publish shared vcpkg dependency cache
        id: shared-vcpkg-publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python .\scripts\vcpkg_release_cache.py publish --key '${{ steps.vcpkg-key.outputs.key }}'
          if ($LASTEXITCODE -ne 0) { throw 'Shared dependency cache publication failed' }
