# 独立 edr-agent 仓库：工作目录 = 本仓库根。**仅一条**发版编线：`win_*` tag → **vcpkg(curl/grpc) + ONNX** → `edr-agent-<tag>-windows-amd64-exe.zip`。
# **-*-grpc-exe.zip** 第二枚已暂停；monorepo 请用仓库根同名 workflow。
#
# 触发：`git push origin <tag>`（`win_M.m.p`）或 Actions Run workflow；首步 `verify_ave_behavior_chain_invariants.sh`。

name: edr-agent client release

on:
  push:
    tags:
      - 'win_*.*.*'

permissions:
  contents: write

concurrency:
  group: edr-agent-release-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  VCPKG_DEFAULT_TRIPLET: x64-windows
  VCPKG_DOWNLOADS: ${{ github.workspace }}/.cache/vcpkg-downloads
  VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/.cache/vcpkg-bincache,readwrite"
  SCCACHE_GHA_ENABLED: "true"

jobs:
  windows-build:
    name: Build Windows (edr_agent.exe + runtime DLLs, vcpkg+ONNX)
    if: ${{ github.event_name == 'push' && startsWith(github.ref_name, 'win_') }}
    runs-on: windows-latest
    timeout-minutes: 360
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
    steps:
      - uses: actions/checkout@v6
      - name: AVE / behavior chain invariants (no vcpkg, bash)
        shell: bash
        run: |
          chmod +x ./scripts/verify_ave_behavior_chain_invariants.sh
          ./scripts/verify_ave_behavior_chain_invariants.sh

      - name: Extract version from tag & update source files
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          # Tag format: win_<version>  or  <prefix>_<version>
          # Extract a.b.c version string
          if ($tag -match '_(\d+\.\d+\.\d+)$') {
            $ver = $Matches[1]
            Write-Host "Extracted version: $ver from tag: $tag"
          } else {
            Write-Host "::error::Cannot extract version from tag: $tag (expected format: <prefix>_a.b.c)"
            throw "Invalid tag format: $tag"
          }
          Write-Host "Running update-version.ps1 with version: $ver"
          & ./scripts/update-version.ps1 $ver
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::update-version.ps1 failed with exit code $LASTEXITCODE"
            throw "Version update failed"
          }
          Write-Host "Version update completed successfully"

      - uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: x64
      - name: Install Ninja
        shell: pwsh
        run: choco install ninja -y --no-progress
      - uses: mozilla-actions/sccache-action@v0.0.10
      - name: Prepare vcpkg cache directories
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path (Join-Path $env:GITHUB_WORKSPACE '.cache/vcpkg-downloads') | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $env:GITHUB_WORKSPACE '.cache/vcpkg-bincache') | Out-Null

      - name: Validate release tag (semver)
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          ref="${GITHUB_REF_NAME}"
          if [[ ! "${ref}" =~ ^win_[0-9]+\.[0-9]+\.[0-9]+([+-].*)?$ ]]; then
            echo "::error::Invalid tag '${ref}'."
            exit 1
          fi

      - name: Cache vcpkg (installed + downloads + binary cache)
        uses: actions/cache@v5
        with:
          path: |
            .cache/vcpkg-downloads
            .cache/vcpkg-bincache
            vcpkg_installed
          key: vcpkg-x64-win-build-${{ hashFiles('vcpkg.json') }}-${{ runner.os }}
          restore-keys: |
            vcpkg-x64-win-build-${{ hashFiles('vcpkg.json') }}-${{ runner.os }}

      - name: Cache ONNX Runtime
        uses: actions/cache@v5
        with:
          path: onnxrt-win
          key: onnxrt-x64-win-1.17.3-${{ runner.os }}

      - name: Cache CMake build directory (incremental)
        uses: actions/cache@v5
        with:
          path: build
          key: build-x64-win-${{ hashFiles('CMakeLists.txt', 'vcpkg.json') }}-${{ runner.os }}-v2
          restore-keys: |
            build-x64-win-${{ hashFiles('CMakeLists.txt', 'vcpkg.json') }}-${{ runner.os }}-v2

      - name: Restore vcpkg from pre-built packages (if cache miss)
        shell: pwsh
        run: |
          $installed_marker = Join-Path $env:GITHUB_WORKSPACE "vcpkg_installed\x64-windows\installed\vcpkg\status"
          if (Test-Path $installed_marker) {
            Write-Host "[pre-build-packages] vcpkg cache hit, skip download"
            "VCPKG_SOURCE=cache" | Out-File -FilePath $env:GITHUB_ENV -Append
            return
          }
          $hash = (Get-FileHash vcpkg.json -Algorithm SHA256).Hash.Substring(0, 12)
          $release_tag = "prebuild-x64-windows-$hash"
          $archive = "vcpkg-installed-x64-windows.7z"
          $url = "https://github.com/${{ github.repository }}/releases/download/$release_tag/$archive"
          Write-Host "[pre-build-packages] Cache miss, trying pre-built: $url"
          try {
            $progressPreference = 'SilentlyContinue'
            Invoke-WebRequest -Uri $url -OutFile $archive -ErrorAction Stop
            Write-Host "[pre-build-packages] Download OK, extracting..."
            7z x $archive -o"$env:GITHUB_WORKSPACE" -y
            if ($LASTEXITCODE -ne 0) { throw "7z extract failed" }
            Remove-Item $archive -Force
            if (Test-Path $installed_marker) {
              Write-Host "[pre-build-packages] Pre-built packages restored from $release_tag"
              "VCPKG_SOURCE=prebuilt:$release_tag" | Out-File -FilePath $env:GITHUB_ENV -Append
            } else {
              throw "Extracted but marker not found"
            }
          } catch {
            Write-Host "[pre-build-packages] Download/extract failed: $_"
            Write-Host "[pre-build-packages] Falling back to source build"
            "VCPKG_SOURCE=source" | Out-File -FilePath $env:GITHUB_ENV -Append
            if (Test-Path $archive) { Remove-Item $archive -Force -ErrorAction SilentlyContinue }
          }

      - name: "[Timing] Build start"
        shell: pwsh
        run: |
          $start = Get-Date
          "BUILD_TIMING_START=$($start.ToString('o'))" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Build started at $($start.ToString('HH:mm:ss'))"

      - name: sccache pre-check
        shell: bash
        run: |
          echo "=== sccache version ==="
          sccache --version || echo "(not found)"
          echo "=== sccache stats (pre-build) ==="
          sccache --show-stats || echo "(stats not available)"

      - name: Clone and bootstrap vcpkg
        working-directory: ${{ github.workspace }}
        shell: pwsh
        run: |
          if (-not (Test-Path "vcpkg\bootstrap-vcpkg.bat")) {
            git clone --depth 1 https://github.com/microsoft/vcpkg.git vcpkg
          }
          & ".\vcpkg\bootstrap-vcpkg.bat" -disableMetrics

      - name: vcpkg install (manifest)
        working-directory: ${{ github.workspace }}
        env:
          VCPKG_DEFAULT_TRIPLET: x64-windows
        shell: pwsh
        run: |
          if (-not (Test-Path "vcpkg.json")) { throw "missing vcpkg.json" }
          $installed_marker = Join-Path $env:GITHUB_WORKSPACE "vcpkg_installed\x64-windows\installed\vcpkg\status"
          if (Test-Path $installed_marker) {
            Write-Host "[vcpkg] Packages already installed (from $env:VCPKG_SOURCE), verifying..."
          }
          $vroot = (Join-Path $env:GITHUB_WORKSPACE "vcpkg")
          $env:VCPKG_ROOT = $vroot
          $env:Path = $vroot + ";" + $env:Path
          $tc = Join-Path $vroot "vcpkg.exe"
          if (-not (Test-Path -LiteralPath $tc)) { throw "missing vcpkg.exe" }
          & $tc install --x-feature=grpc-client --x-feature=sqlite --x-feature=yara
          "VCPKG_INSTALLED_X64=" + (Join-Path $env:GITHUB_WORKSPACE "vcpkg_installed\x64-windows") | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Regenerate gRPC proto stubs
        shell: pwsh
        run: |
          $protoc_exe = Join-Path $env:VCPKG_INSTALLED_X64 "tools\protobuf\protoc.exe"
          if (-not (Test-Path $protoc_exe)) {
            Write-Host "[skip] protoc not found at $protoc_exe"
            return
          }
          $grpc_plugin = Join-Path $env:VCPKG_INSTALLED_X64 "tools\grpc\grpc_cpp_plugin.exe"
          if (-not (Test-Path $grpc_plugin)) {
            Write-Host "[skip] grpc_cpp_plugin not found at $grpc_plugin"
            return
          }
          # protoc needs vcpkg runtime DLLs (e.g. zlib.dll) on PATH
          $env:PATH = "$env:VCPKG_INSTALLED_X64\bin;$env:PATH"
          $out_dir = "src/grpc_gen/edr/v1"
          New-Item -ItemType Directory -Force -Path $out_dir | Out-Null
          Write-Host "Regenerating gRPC stubs ..."
          & $protoc_exe -I proto --cpp_out=src/grpc_gen --grpc_out=src/grpc_gen --plugin=protoc-gen-grpc=$grpc_plugin proto/edr/v1/ingest.proto
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::protoc failed with exit code $LASTEXITCODE"
            throw "protoc failed"
          }
          Write-Host "gRPC stubs regenerated OK"

      - name: ONNX Runtime (CPU, Windows x64)
        working-directory: ${{ github.workspace }}
        shell: pwsh
        run: |
          $dest = Join-Path $env:GITHUB_WORKSPACE "onnxrt-win"
          $root = Join-Path $dest "onnxruntime-win-x64-1.17.3"
          if (Test-Path (Join-Path $root "include\onnxruntime_c_api.h")) {
            Write-Host "[skip] ONNX Runtime 1.17.3 already cached at $root"
          } else {
            New-Item -ItemType Directory -Force -Path $dest | Out-Null
            $zip = Join-Path $dest "ort.zip"
            [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
            $progressPreference = 'SilentlyContinue'
            $wc = New-Object System.Net.WebClient
            $wc.Headers.Add('User-Agent', 'edr-agent-ci')
            for ($i = 0; $i -lt 5; $i++) {
              try {
                $wc.DownloadFile("https://github.com/microsoft/onnxruntime/releases/download/v1.17.3/onnxruntime-win-x64-1.17.3.zip", $zip)
                Write-Host "ORT download OK"
                break
              } catch {
                Write-Host "ORT download attempt $($i+1)/5 failed: $_"
                if ($i -ge 4) { throw "ORT download exhausted retries: $_" }
                Start-Sleep -Seconds 15
              }
            }
            Expand-Archive -LiteralPath $zip -DestinationPath $dest -Force
            if (-not (Test-Path -LiteralPath $root)) { throw "ORT extract layout unexpected" }
          }
          "ONNXRUNTIME_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Configure (Ninja, Release, ONNX, sccache)
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
        shell: pwsh
        run: |
          $tcf = (Join-Path $env:VCPKG_ROOT "scripts\buildsystems\vcpkg.cmake")
          if (-not (Test-Path -LiteralPath $tcf)) { throw "toolchain: $tcf" }
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$tcf" `
            -DCMAKE_C_COMPILER_LAUNCHER=sccache `
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache `
            -DEDR_WITH_GRPC=ON `
            -DEDR_WITH_ONNXRUNTIME=ON `
            -DEDR_ENABLE_IPO=ON `
            "-DONNXRUNTIME_ROOT=$env:ONNXRUNTIME_ROOT" `
            "-DVCPKG_INSTALLED_DIR=$env:VCPKG_INSTALLED_X64" `
            -DEDR_BUILD_TESTS=OFF
          if (-not $?) { throw "cmake configure failed" }

      - name: Build (Ninja + sccache)
        run: cmake --build build --parallel $env:NUMBER_OF_PROCESSORS --verbose

      - name: sccache stats
        shell: bash
        run: |
          echo "=== sccache compilation cache stats ==="
          sccache --show-stats || echo "(sccache stats unavailable)"

      - name: Stage ORT + vcpkg runtime DLLs
        shell: pwsh
        run: |
          $env:VCPKG_INSTALLED_X64 = (Join-Path $env:GITHUB_WORKSPACE "vcpkg_installed\x64-windows")
          ./scripts/stage_ort_dlls_build_release.ps1
          ./scripts/stage_vcpkg_runtime_dlls_build_release.ps1

      - name: Test
        shell: bash
        run: ctest --test-dir build --output-on-failure

      - name: "[Timing] Build summary"
        if: always()
        shell: pwsh
        run: |
          if ($env:BUILD_TIMING_START) {
            $start = [DateTime]::Parse($env:BUILD_TIMING_START)
            $elapsed = (Get-Date) - $start
            Write-Host "========================================"
            Write-Host "Total elapsed build time: $($elapsed.TotalMinutes.ToString('F1')) minutes ($($elapsed.TotalSeconds)s)"
            Write-Host "vcpkg source : $env:VCPKG_SOURCE"
            $installed_marker = Join-Path $env:GITHUB_WORKSPACE "vcpkg_installed\x64-windows\installed\vcpkg\status"
            if (Test-Path $installed_marker) {
              $size = [math]::Round(((Get-ChildItem -Path "vcpkg_installed" -Recurse -File | Measure-Object -Property Length -Sum).Sum / 1MB), 1)
              Write-Host "vcpkg installed size: ${size} MB"
            }
            Write-Host "========================================"
          }

      - name: Package (exe + runtime DLLs + Windows ops scripts)
        shell: pwsh
        run: |
          $zip = "edr-agent-${{ github.ref_name }}-windows-amd64-exe.zip"
          if (-not (Test-Path "build\Release\edr_agent.exe")) { throw "missing build\Release\edr_agent.exe" }
          $items = New-Object System.Collections.Generic.List[string]
          $null = $items.Add("build\Release\edr_agent.exe")
          Get-ChildItem "build\Release" -Filter "*.dll" -File -ErrorAction SilentlyContinue | ForEach-Object { $null = $items.Add($_.FullName) }
          foreach ($p in @(
            "scripts\edr_agent_install.ps1",
            "scripts\windows_service_install.ps1",
            "scripts\windows_isolate_host.ps1",
            "config\agent_windows_production.example.toml"
          )) {
            if (Test-Path $p) { $null = $items.Add($p) }
          }
          Compress-Archive -Path $items.ToArray() -DestinationPath $zip -Force

      - name: Move artifact to workspace
        shell: pwsh
        run: |
          $src = "edr-agent-${{ github.ref_name }}-windows-amd64-exe.zip"
          if (-not (Test-Path -LiteralPath $src)) { throw "missing $src" }
          Copy-Item -Path $src -Destination (Join-Path $env:GITHUB_WORKSPACE "edr-agent-win-exe.zip") -Force

      - uses: actions/upload-artifact@v4
        with:
          name: edr-agent-windows-${{ github.ref_name }}
          path: edr-agent-win-exe.zip
          retention-days: 14
          if-no-files-found: error

  windows-release:
    name: Publish Windows Release
    if: ${{ github.event_name == 'push' && startsWith(github.ref_name, 'win_') }}
    needs: [windows-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: edr-agent-windows-${{ github.ref_name }}
          path: dist
      - name: Verify artifacts
        run: ls -la dist/
      - name: Rename to tag names
        run: |
          set -euo pipefail
          ref="${{ github.ref_name }}"
          test -f "dist/edr-agent-win-exe.zip"
          mv "dist/edr-agent-win-exe.zip" "dist/edr-agent-${ref}-windows-amd64-exe.zip"
      - uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: edr-agent ${{ github.ref_name }} (Windows amd64, vcpkg+ONNX)
          generate_release_notes: true
          files: dist/*.zip
          fail_on_unmatched_files: true
