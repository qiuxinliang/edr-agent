name: Hosted assembly of USB-signed files
on:
  workflow_call:
    inputs:
      stage:
        required: true
        type: string
      phase:
        required: true
        type: string
      next_phase:
        required: true
        type: string
permissions:
  contents: write
  actions: read
jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PACKAGE_STAGE: ${{ inputs.stage }}
      PACKAGE_PHASE: ${{ inputs.phase }}
      NEXT_PHASE: ${{ inputs.next_phase }}
      USB_THUMBPRINT: ${{ vars.WINDOWS_USB_THUMBPRINT }}
      USB_SUBJECT: ${{ vars.WINDOWS_USB_SIGNER_SUBJECT }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: package-state-${{ inputs.phase }}-*
          path: state
      - uses: actions/download-artifact@v4
        with:
          name: usb-${{ inputs.phase }}-response
          path: response
      - name: Validate responses and assemble on hosted runner
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $inno=Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if($env:PACKAGE_STAGE -eq 'Installer' -and -not(Test-Path -LiteralPath $inno)) { throw 'Hosted Inno Setup compiler is missing' }
          foreach($arch in @('amd64','arm64')) {
            .\scripts\Complete-WindowsUsbRelease.ps1 -Stage $env:PACKAGE_STAGE -OutputDirectory "$PWD\state\package-state-$env:PACKAGE_PHASE-$arch" -ResponseDirectory "$PWD\response\$arch" -ExpectedCommit $env:GITHUB_SHA -Thumbprint $env:USB_THUMBPRINT -ManifestSignerSubject $env:USB_SUBJECT -Inno $inno
          }
      - uses: actions/upload-artifact@v4
        if: inputs.stage != 'Verify'
        with:
          name: package-state-${{ inputs.next_phase }}-amd64
          path: state/package-state-${{ inputs.phase }}-amd64/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: inputs.stage != 'Verify'
        with:
          name: package-state-${{ inputs.next_phase }}-arm64
          path: state/package-state-${{ inputs.phase }}-arm64/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: inputs.stage != 'Verify'
        with:
          name: usb-${{ inputs.next_phase }}-request-amd64
          path: state/package-state-${{ inputs.phase }}-amd64/${{ inputs.next_phase }}-request/
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: inputs.stage != 'Verify'
        with:
          name: usb-${{ inputs.next_phase }}-request-arm64
          path: state/package-state-${{ inputs.phase }}-arm64/${{ inputs.next_phase }}-request/
          if-no-files-found: error
          retention-days: 3
      - name: Upload verified assets to unpublished draft
        if: inputs.stage == 'Verify'
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          foreach($arch in @('amd64','arm64')) {
            $root="$PWD\state\package-state-$env:PACKAGE_PHASE-$arch"
            $state=Get-Content "$root\state.json" -Raw | ConvertFrom-Json
            if($state.stage -ne 'verified') { throw 'Unsigned or incomplete packaging state' }
            $tag="win_$($state.version)"
            $draft=gh release view $tag --repo $env:GITHUB_REPOSITORY --json isDraft --jq .isDraft
            if($LASTEXITCODE -ne 0 -or $draft -ne 'true') { throw 'Refusing to modify a published or missing release' }
            $assets=@(Get-ChildItem "$root\dist" -File)
            if($assets.Count -ne 6) { throw 'Incomplete signed release asset set' }
            gh release upload $tag --repo $env:GITHUB_REPOSITORY @($assets.FullName) --clobber
            if($LASTEXITCODE -ne 0) { throw 'Verified release asset upload failed' }
          }
