# 与 monorepo 根目录 `.github/workflows/edr-agent-ci.yml` 逻辑一致；本仓库**根**即 `edr-agent/`，无 `edr-agent/` 路径前缀。
# 无 gRPC 快编：vcpkg 清单**默认只 `curl`** + 工具链；`build-linux` 关闭（仅跑 Windows）— 要恢复则去掉 `if: false`。
# `build-windows` 首步：`./scripts/verify_ave_behavior_chain_invariants.sh`（**无**编译，与根目录 `precheck` 中同名检查同源）。

name: edr-agent build

on:
  push:
    tags:
      - 'win_*.*.*'
  pull_request:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-windows:
    runs-on: windows-2022
    env:
      VCPKG_ROOT: ${{ github.workspace }}\vcpkg
    steps:
      - uses: actions/checkout@v6
      - name: AVE / behavior chain invariants (no vcpkg, bash)
        shell: bash
        run: |
          chmod +x ./scripts/verify_ave_behavior_chain_invariants.sh
          ./scripts/verify_ave_behavior_chain_invariants.sh
      - name: Prepare vcpkg download cache
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path (Join-Path $env:GITHUB_WORKSPACE '.cache/vcpkg-downloads') | Out-Null
      - name: Cache vcpkg (manifest：curl)
        uses: actions/cache@v5
        with:
          path: |
            .cache/vcpkg-downloads
            vcpkg_installed
          key: vcpkg-x64-win-https-sqlite-yara-nogrpc-${{ hashFiles('vcpkg.json', 'CMakeLists.txt') }}-${{ runner.os }}
          restore-keys: |
            vcpkg-x64-win-https-sqlite-yara-nogrpc-${{ hashFiles('vcpkg.json') }}-
      - name: Bootstrap pinned vcpkg
        shell: pwsh
        run: .\scripts\bootstrap_pinned_vcpkg.ps1
      - name: vcpkg install (curl + OpenSSL + SQLite + YARA; no grpc feature)
        env:
          VCPKG_DEFAULT_TRIPLET: x64-windows
          VCPKG_DOWNLOADS: ${{ github.workspace }}/.cache/vcpkg-downloads
        shell: pwsh
        run: |
          if (-not (Test-Path "vcpkg.json")) { throw "missing vcpkg.json" }
          $vroot = (Join-Path $env:GITHUB_WORKSPACE "vcpkg")
          $env:Path = $vroot + ";" + $env:Path
          $v = Join-Path $vroot "vcpkg.exe"
          Push-Location $env:GITHUB_WORKSPACE
          & $v install --x-feature=yara
          $vcpkgX64 = Join-Path $env:GITHUB_WORKSPACE "vcpkg_installed\x64-windows"
          Write-Host "[vcpkg] YARA package probe under $vcpkgX64"
          foreach ($p in @(
            (Join-Path $vcpkgX64 "share\unofficial-libyara\unofficial-libyara-config.cmake"),
            (Join-Path $vcpkgX64 "include\yara.h"),
            (Join-Path $vcpkgX64 "include\yara\yara.h"),
            (Join-Path $vcpkgX64 "lib\yara.lib"),
            (Join-Path $vcpkgX64 "lib\libyara.lib")
          )) {
            if (Test-Path -LiteralPath $p) { Write-Host "[vcpkg] found $p" } else { Write-Host "[vcpkg] missing $p" }
          }

          Pop-Location
      - name: Initialize pinned Visual Studio 2022 environment
        shell: pwsh
        run: .\scripts\Initialize-VS2022Environment.ps1 -Architecture x64
      - name: Install Ninja
        shell: pwsh
        run: choco install ninja -y --no-progress
      - name: Configure (vcpkg HTTPS + SQLite + YARA, no gRPC, Ninja)
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
        shell: pwsh
        run: |
          $tcf = (Join-Path $env:VCPKG_ROOT "scripts\buildsystems\vcpkg.cmake")
          if (-not (Test-Path -LiteralPath $tcf)) { throw "vcpkg toolchain: $tcf" }
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$tcf" `
            "-DCMAKE_PREFIX_PATH=$env:GITHUB_WORKSPACE/vcpkg_installed/x64-windows" `
            "-DVCPKG_MANIFEST_FEATURES=yara" `
            "-DVCPKG_INSTALLED_DIR=$env:GITHUB_WORKSPACE/vcpkg_installed" `
            -DEDR_WITH_GRPC=OFF `
            -DEDR_WITH_INGEST_HTTPS_OPENSSL=ON `
            -DEDR_REQUIRE_SQLITE=ON `
            -DEDR_WITH_ONNXRUNTIME=OFF `
            -DEDR_WITH_YARA=ON `
            -DEDR_REQUIRE_YARA=ON `
            -DEDR_BUILD_TESTS=ON
      - name: Build
        shell: pwsh
        run: |
          $windowsTargets = @(
            'edr_agent',
            'test_command_contract',
            'test_agent_update_contract',
            'test_agent_update_assets',
            'test_windows_headless_runtime_contract'
          )
          cmake --build build --target $windowsTargets --parallel $env:NUMBER_OF_PROCESSORS
          if ($LASTEXITCODE -ne 0) { throw "Windows product or gate-test build failed with exit code $LASTEXITCODE" }
          foreach ($nativeTarget in @('fd_installer_worker', 'fd_headless_uninstaller')) {
            cmake --build build --target $nativeTarget --parallel $env:NUMBER_OF_PROCESSORS
            if ($LASTEXITCODE -ne 0) { throw "Windows native target $nativeTarget failed with exit code $LASTEXITCODE" }
          }
      - name: Verify HTTPS REST and SQLite compiled in
        shell: pwsh
        run: |
          $exe = @("build\FDSensor.exe", "build\Release\FDSensor.exe") | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $exe) { throw "FDSensor.exe not found after build" }
          $text = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes((Resolve-Path $exe)))
          if ($text.Contains("https requested but OpenSSL disabled")) { throw "missing HTTPS REST OpenSSL support" }
          if ($text.Contains("sqlite disabled")) { throw "missing SQLite local storage support" }
          if ($text.Contains("This Agent build does not include libyara-backed YARA support")) { throw "missing libyara-backed YARA support" }
      - name: Test
        shell: pwsh
        run: |
          $listed = & ctest --test-dir build -N
          if ($LASTEXITCODE -ne 0 -or (($listed -join "`n") -match 'Total Tests:\s*0')) {
            throw "CI test configuration has no discoverable tests"
          }
          $required = @(
            'agent_update_command_contract',
            'agent_update_packaging_contract',
            'windows_headless_runtime_contract',
            'command_registry_and_payload_contract'
          )
          $listedText = $listed -join "`n"
          foreach ($name in $required) {
            if ($listedText -notmatch [regex]::Escape($name)) {
              throw "Required Windows CI test was not configured: $name"
            }
          }
          & ctest --test-dir build --output-on-failure --tests-regex '^(agent_update_command_contract|agent_update_packaging_contract|windows_headless_runtime_contract|command_registry_and_payload_contract)$'
          if ($LASTEXITCODE -ne 0) { throw "CI tests failed" }

  build-linux:
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build ccache
      - name: Configure
        env:
          CC: ccache gcc
          CXX: ccache g++
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DEDR_WITH_GRPC=OFF \
            -DEDR_WITH_ONNXRUNTIME=OFF \
            -DEDR_WITH_YARA=ON \
            -DEDR_BUILD_TESTS=OFF
      - name: Build
        run: cmake --build build --parallel $(nproc)
      - name: ccache stats
        run: ccache -s
      - name: Test
        run: ctest --test-dir build --output-on-failure
