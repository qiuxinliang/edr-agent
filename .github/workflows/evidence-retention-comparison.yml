# Native contracts and storage comparisons before a candidate release. Contract
# dependencies are built; private compiled tools preserve their actual gate outcome.
# Failed-gate tools are restricted to the two fixed isolated reclaim contracts.
# No product packaging, release or endpoint access. A manual opt-in diagnosis
# may create one disposable ARM64 SCM service from an unshipped diagnostic build.
name: Evidence retention native comparison

on:
  workflow_dispatch:
    inputs:
      diagnose_service_stop:
        description: 'Run one isolated ARM64 Service stop diagnosis; no release or endpoint'
        type: boolean
        required: false
        default: false
  push:
    paths:
      - tests/evidence_retention_comparison.c
      - tests/queue_retention_comparison.c
      - tests/run_evidence_retention_comparison.py
      - tests/run_queue_retention_comparison.py
      - tests/retention_benchmark_support.h
      - tests/retention_comparison_support.py
      - scripts/stage_retention_native_tools.py
      - tests/test_stage_retention_native_tools.py
      - tests/test_local_evidence_cache_candidate.c
      - tests/test_queue_recovery.c
      - tests/test_egress_request_policy.c
      - src/storage/local_evidence_cache.c
      - include/edr/local_evidence_cache.h
      - src/storage/queue_sqlite.c
      - include/edr/storage_queue.h
      - src/transport/egress_batch_policy.c
      - src/transport/egress_request_policy.c
      - include/edr/egress_batch_policy.h
      # Candidate verification binds measurements to the release owners' source.
      - .github/workflows/edr-agent-client-release.yml
      - .github/workflows/windows-install-upgrade-rollback.yml
      - scripts/Write-HeadlessInstallerManifest.ps1
      - tests/test_headless_installer_manifest.ps1
      - tests/test_windows_release_gate.py
      - tests/test_pcre2_cmake_gate.py
      - tests/test_p0_source_only_durable_contract.c
      - tests/test_p0_observation_semantics.c
      - tests/run_telemetry_windows_native.ps1
      - tests/test_native_gate_runner.ps1
      - tests/CMakeLists.txt
      - tests/pipeline_stop_diag/**
      - cmake/AgentRuntimeGate.cmake
      - cmake/WindowsReleaseGate.cmake
      - .github/workflows/evidence-retention-comparison.yml

permissions:
  contents: read

concurrency:
  group: evidence-retention-comparison-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  VCPKG_DOWNLOADS: ${{ github.workspace }}/.cache/vcpkg-downloads
  VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/.cache/vcpkg-bincache,read"

jobs:
  compare:
    name: Native storage comparison ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - arch: amd64
            runner: windows-2022
            msvc_arch: x64
            triplet: x64-windows
            cmake_processor: AMD64
          - arch: arm64
            runner: windows-11-vs2026-arm
            msvc_arch: arm64
            triplet: arm64-windows
            cmake_processor: ARM64
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_DEFAULT_TRIPLET: ${{ matrix.triplet }}
      P0_TEST_INPUTS_REF: ${{ vars.P0_TEST_INPUTS_REF }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      # Fail before compiler/dependency work if the real preparation prefix
      # cannot establish its private directory or load the pinned QA owners.
      - name: Check isolated Service preparation before native builds
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.diagnose_service_stop && matrix.arch == 'arm64' }}
        timeout-minutes: 2
        shell: pwsh
        run: |
          $driver = Join-Path $env:GITHUB_WORKSPACE 'tests/pipeline_stop_diag/diagnose_service_once.ps1'
          $qaDriver = Join-Path $env:GITHUB_WORKSPACE 'tests/cache-recovery/windows_cache_recovery_ci.ps1'
          $driverSha = (Get-FileHash -LiteralPath $driver -Algorithm SHA256).Hash.ToLowerInvariant()
          $qaDriverSha = (Get-FileHash -LiteralPath $qaDriver -Algorithm SHA256).Hash.ToLowerInvariant()
          & ./tests/pipeline_stop_diag/test_prepared_service_contracts.ps1 -DriverSource $driver -DriverSha256 $driverSha
          if (-not $?) { throw 'Pure Service failure projection contract failed before native builds' }
          & ./tests/cache-recovery/test_recovery_driver_contracts.ps1 -DriverSource $qaDriver -DriverSha256 $qaDriverSha
          if (-not $?) { throw 'Source-owned Service observation contracts failed before native builds' }
          & ./tests/pipeline_stop_diag/test_service_preparation.ps1 -DriverSource $driver -DriverSha256 $driverSha -QADriverSource $qaDriver -QADriverSha256 $qaDriverSha
          if (-not $?) { throw 'Service preparation prefix failed before any Agent or SCM execution' }
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.10'
          architecture: x64
      # Exercise the same isolated fixture before any candidate release. The
      # synthetic PE is parsed only; no installer or endpoint is executed.
      - name: Verify Headless installer manifest contract
        shell: powershell
        run: .\tests\test_headless_installer_manifest.ps1
      - name: Initialize the locked native compiler owner
        shell: pwsh
        run: .\scripts\Initialize-VSEnvironment.ps1 -Architecture '${{ matrix.msvc_arch }}'
      - name: Read fixed private P0 contract inputs
        timeout-minutes: 5
        env:
          P0_TEST_INPUTS_SSH_KEY: ${{ secrets.P0_TEST_INPUTS_SSH_KEY }}
        shell: pwsh
        run: .\scripts\checkout_private_p0_inputs.ps1 -Directory .p0-test-inputs -Ref $env:P0_TEST_INPUTS_REF
      - name: Verify private P0 contract input identity and pair
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: --requirement requirements-release.txt
          if ($LASTEXITCODE -ne 0) { throw 'P0 contract verification dependency installation failed' }
          python -B scripts/windows_release_checkpoint.py verify-p0-inputs --directory .p0-test-inputs
          if ($LASTEXITCODE -ne 0) { throw 'P0 contract input verification failed' }
      - name: Identify existing locked dependency cache
        id: vcpkg-key
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .cache/vcpkg-downloads, .cache/vcpkg-bincache | Out-Null
          python scripts/vcpkg_cache_key.py --triplet '${{ matrix.triplet }}'
          if ($LASTEXITCODE -ne 0) { throw 'Locked dependency cache identity failed' }
      - uses: actions/cache/restore@v5
        with:
          path: |
            .cache/vcpkg-downloads
            .cache/vcpkg-bincache
          key: ${{ steps.vcpkg-key.outputs.key }}
          restore-keys: |
            ${{ steps.vcpkg-key.outputs.restore-prefix }}
      - name: Bootstrap existing pinned vcpkg owner
        shell: pwsh
        run: .\scripts\bootstrap_pinned_vcpkg.ps1
      - name: Install and ABI-check the existing manifest closure
        shell: pwsh
        run: |
          & .\scripts\Invoke-VcpkgInstallWithRetry.ps1 -VcpkgExe (Join-Path $env:VCPKG_ROOT 'vcpkg.exe') -FeatureArgs @('--x-feature=sqlite', '--x-feature=yara') -MaxAttempts 3 -InitialBackoffSeconds 30
      - name: Verify release gate build dependencies
        env:
          CMAKE_PREFIX_PATH: ${{ github.workspace }}/vcpkg_installed/${{ matrix.triplet }}
        shell: pwsh
        run: |
          python -B tests/test_windows_release_gate.py --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'Windows release gate dependency regression failed' }
          python -B tests/test_pcre2_cmake_gate.py PCRE2CMakeGateTests.test_static_matcher_header_wins_over_shared_dependency_prefix -v
          if ($LASTEXITCODE -ne 0) { throw 'Windows PCRE2 header isolation regression failed' }
      - name: Build and execute actual native release and telemetry contracts
        id: contracts
        shell: pwsh
        run: |
          & .\tests\test_native_gate_runner.ps1
          $prefix = Join-Path $env:GITHUB_WORKSPACE 'vcpkg_installed/${{ matrix.triplet }}'
          $toolchain = Join-Path $env:VCPKG_ROOT 'scripts/buildsystems/vcpkg.cmake'
          cmake -B contract-build -G Ninja -DCMAKE_BUILD_TYPE=Release `
            "-DCMAKE_TOOLCHAIN_FILE=$toolchain" `
            "-DCMAKE_PREFIX_PATH=$prefix" `
            "-DVCPKG_INSTALLED_DIR=$env:GITHUB_WORKSPACE/vcpkg_installed" `
            '-DCMAKE_SYSTEM_PROCESSOR=${{ matrix.cmake_processor }}' `
            '-DEDR_WINDOWS_TARGET_ARCH=${{ matrix.arch }}' `
            -DVCPKG_MANIFEST_FEATURES=yara `
            '-DEDR_PCRE2_PRODUCER_TARGET=windows/${{ matrix.arch }}' `
            "-DEDR_PCRE2_VCPKG_ROOT=$env:VCPKG_ROOT" `
            -DEDR_WITH_INGEST_HTTPS_OPENSSL=ON -DEDR_WITH_P0_RULES_OPENSSL=ON `
            -DEDR_REQUIRE_SQLITE=ON -DEDR_WITH_YARA=ON -DEDR_REQUIRE_YARA=ON `
            -DEDR_ENABLE_IPO=ON "-DEDR_P0_TEST_CONFIG_DIR=$env:EDR_BACKEND_CONFIG_DIR" `
            -DEDR_BUILD_TESTS=ON
          if ($LASTEXITCODE -ne 0) { throw 'Native contract configuration failed' }
          $opensslTools = Join-Path $prefix 'tools/openssl'
          & .\tests\run_telemetry_windows_native.ps1 -BuildDir contract-build -Configuration Release -OpenSslBin $opensslTools -IncludeReleaseGate
          if ($LASTEXITCODE -ne 0) { throw 'Actual native release and telemetry contracts failed before comparison' }
      - name: Repeat the native bounded-reclaim contracts
        id: sliced
        timeout-minutes: 5
        shell: pwsh
        run: |
          $prefix = Join-Path $env:GITHUB_WORKSPACE 'vcpkg_installed/${{ matrix.triplet }}'
          $env:PATH = (Join-Path $prefix 'bin') + ';' + $env:PATH
          $probe = @'
          import os, pathlib, subprocess
          root = pathlib.Path(os.environ['GITHUB_WORKSPACE'])
          logs = pathlib.Path(os.environ['RUNNER_TEMP'])/'retention-sliced-contract'
          logs.mkdir(exist_ok=False)
          for index in range(12):
              # Historical test-only trim behavior is a same-binary discriminator,
              # never a replacement for the three current contracts below.
              with (logs/f'historical-trim-{index:02d}.log').open('xb') as output:
                  baseline = subprocess.run([str(root/'contract-build/tests/test_local_evidence_cache_candidate.exe'), '--capacity-reclaim-progress-trim-baseline'], stdout=output, stderr=subprocess.STDOUT, timeout=180)
              print(f'historical_trim_run={index+1} return_code={baseline.returncode} acceptance_claimed=false', flush=True)
              for label, argv in [('sliced', '--sliced-reclaim-contract'), ('capacity', '--capacity-reclaim-contract'), ('progress', '--capacity-reclaim-progress')]:
                  with (logs/f'case-{label}-{index:02d}.log').open('xb') as output:
                      result = subprocess.run([str(root/'contract-build/tests/test_local_evidence_cache_candidate.exe'), argv], stdout=output, stderr=subprocess.STDOUT, timeout=180)
                  print(f'{label}_contract_run={index+1} return_code={result.returncode}', flush=True)
                  if result.returncode:
                      raise SystemExit(1)
          '@
          python -B -c $probe
          if ($LASTEXITCODE -ne 0) { throw 'Native bounded-reclaim contract failed; inspect the first failure log' }
      - name: Stage the compiled private native diagnostic tool
        id: native-tools
        if: ${{ always() && (steps.contracts.outcome == 'success' || steps.contracts.outcome == 'failure') }}
        timeout-minutes: 5
        shell: pwsh
        run: |
          python -B tests/test_stage_retention_native_tools.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Native diagnostic packaging regressions failed' }
          $prefix = Join-Path $env:GITHUB_WORKSPACE 'vcpkg_installed/${{ matrix.triplet }}'
          $compiler = (Get-Command cl.exe -ErrorAction Stop).Source
          $dumpbin = (Get-Command dumpbin.exe -ErrorAction Stop).Source
          if (-not $env:VCToolsRedistDir) { throw 'Initialized MSVC redist owner is missing' }
          $prior = if ('${{ steps.contracts.outcome }}' -eq 'success' -and '${{ steps.sliced.outcome }}' -eq 'success') { 'passed' } else { 'failed' }
          $artifactPrefix = if ($prior -eq 'passed') { 'evidence-native-tools' } else { 'evidence-failed-gate-tools' }
          "artifact_prefix=$artifactPrefix" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          python -B scripts/stage_retention_native_tools.py --repo "$env:GITHUB_WORKSPACE" --build-dir "$env:GITHUB_WORKSPACE/contract-build" --dependency-prefix "$prefix" --msvc-redist-root "$env:VCToolsRedistDir" --compiler "$compiler" --dumpbin "$dumpbin" --output "$env:RUNNER_TEMP/evidence-native-tools" --arch '${{ matrix.arch }}' --source-sha '${{ github.sha }}' --run-id '${{ github.run_id }}' --run-attempt '${{ github.run_attempt }}' --prior-contract-status "$prior"
          if ($LASTEXITCODE -ne 0) { throw 'Native diagnostic tool dependency closure failed' }
      # Preserve this independent stage before comparisons run. A later failure
      # remains a failure; this artifact does not certify the complete workflow.
      - name: Preserve the private native diagnostic tool separately
        if: ${{ always() && steps.native-tools.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.native-tools.outputs.artifact_prefix }}-${{ matrix.arch }}-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          path: ${{ runner.temp }}/evidence-native-tools/
      # Independent diagnostic: earlier tools still certify only their original gates.
      - name: Build and run the bounded real pipeline diagnostic
        id: pipeline-stop-diag
        timeout-minutes: 5
        shell: pwsh
        run: |
          cmake --build contract-build --config Release --target test_preprocess_stop_boundary --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'Real pipeline diagnostic target failed to build' }
          $prefix = Join-Path $env:GITHUB_WORKSPACE 'vcpkg_installed/${{ matrix.triplet }}'
          $env:PATH = (Join-Path $prefix 'bin') + ';' + $env:PATH
          $probe = @'
          import datetime, hashlib, json, os, pathlib, subprocess, sys, time
          root = pathlib.Path(os.environ['GITHUB_WORKSPACE'])
          case = pathlib.Path(os.environ['RUNNER_TEMP'])/'preprocess-stop-boundary-profile'
          case.mkdir(exist_ok=False)
          exe = root/'contract-build/tests/test_preprocess_stop_boundary.exe'
          cap = 1024*1024
          def need(ok, cause):
              if not ok: raise RuntimeError(cause)
          def digest(raw): return hashlib.sha256(raw).hexdigest()
          def save(name, value):
              raw = (json.dumps(value, sort_keys=True, indent=2)+'\n').encode('ascii')
              with (case/name).open('xb') as stream:
                  need(stream.write(raw)==len(raw), 'receipt_short_write')
          def unique(pairs):
              value = {}
              for key, entry in pairs:
                  need(key not in value, 'duplicate_json_key')
                  value[key] = entry
              return value
          def parse(line):
              return json.loads(line.decode('utf-8', 'strict'), object_pairs_hook=unique,
                                parse_constant=lambda value: (_ for _ in ()).throw(ValueError('nonfinite_json')))
          def take(path):
              before = path.stat()
              need(path.is_file() and not path.is_symlink() and 0<=before.st_size<=cap, 'fixed_log_size_or_type')
              with path.open('rb') as stream: raw=stream.read(cap+1)
              after = path.stat()
              need((before.st_ino,before.st_size,before.st_mtime_ns)==(after.st_ino,after.st_size,after.st_mtime_ns)
                   and len(raw)==after.st_size, 'fixed_log_changed_or_oversize')
              return raw
          identity = dict(source_sha=os.environ['GITHUB_SHA'], run_id=os.environ['GITHUB_RUN_ID'],
                          run_attempt=os.environ['GITHUB_RUN_ATTEMPT'], arch=sys.argv[1],
                          exe_sha256=digest(exe.read_bytes()), profiles=['ready','missing'],
                          worker_work_ms=85000, parent_total_ms=90000, automatic_retry=False)
          save('intent.json', identity)
          child=None; code=None; failure=None; accepted=False; rows=[]; streams={}
          started=time.monotonic()
          with (case/'parent.stdout.log').open('xb') as output, (case/'parent.stderr.log').open('xb') as error:
              try:
                  child=subprocess.Popen([str(exe)], cwd=case, stdout=output, stderr=error)
                  # The C parent owns the pre-resume Job and its shared 85+5s
                  # budget. Five outer seconds only allow receipt/handle cleanup.
                  code=child.wait(timeout=95)
              except BaseException as problem:
                  failure='parent_'+type(problem).__name__
              finally:
                  if child is not None and child.poll() is None:
                      try: child.kill(); child.wait(timeout=5)
                      except BaseException as problem: failure=failure or 'parent_terminal_unknown_'+type(problem).__name__
          try:
              for name in ('parent.stdout.log','parent.stderr.log'):
                  raw=take(case/name); streams[name]=dict(bytes=len(raw),sha256=digest(raw))
                  if name=='parent.stdout.log': rows=[parse(line) for line in raw.splitlines()]
                  else: need(not raw, 'unexpected_parent_stderr')
              need(type(code) is int and code==0, 'parent_exit_nonzero_or_unknown')
              need(len(rows)==2, 'two_parent_receipts_required')
              combined=0
              for profile,row in zip(('ready','missing'), rows):
                  need(type(row) is dict and row.get('schema')=='edr.private.pipeline-parent.v1'
                       and row.get('profile')==profile and row.get('cause')=='worker_complete', 'parent_profile_identity')
                  for key in ('accepted','child_exit_known','job_natural_zero','cleanup_verified'):
                      need(row.get(key) is True, 'parent_'+key)
                  need(row.get('termination_attempted') is False and row.get('parent_deadline_exceeded') is False
                       and type(row.get('child_exit_code')) is int and row['child_exit_code']==0
                       and type(row.get('child_pid')) is int and row['child_pid']>0
                       and type(row.get('child_birth_filetime')) is int and row['child_birth_filetime']>0,
                       'parent_terminal_contract')
                  bodies={}
                  for stream in ('stdout','stderr'):
                      name='pipeline-stop-16-'+profile+'/worker.'+stream+'.log'
                      raw=take(case/name); combined+=len(raw); need(combined<=cap, 'combined_worker_log_cap')
                      need(len(raw)==row[stream+'_bytes'], 'parent_stream_length_mismatch')
                      streams[name]=dict(bytes=len(raw),sha256=digest(raw)); bodies[stream]=raw
                  records=[parse(line) for line in bodies['stdout'].splitlines()]
                  need(all(type(record) is dict for record in records), 'worker_object_rows')
                  drain=[record for record in records if record.get('kind')=='pipeline_diag_drain_end']
                  complete=[record for record in records if record.get('kind')=='pipeline_diag_worker_complete']
                  stages=[record for record in records if record.get('kind')=='pipeline_diag_stage']
                  evidence_stop=[record for record in records if record.get('kind')=='pipeline_diag_evidence_stop']
                  need(len(evidence_stop)==1 and all(type(evidence_stop[0].get(key)) is int and evidence_stop[0][key]==0
                       for key in ('shutdown_timeouts','terminal_unhealthy','slots_used')), 'evidence_worker_stop_unknown_or_unhealthy')
                  need(len(drain)==len(complete)==1 and complete[0].get('cleanup_returned') is True, 'worker_complete')
                  d=drain[0]
                  need(d.get('slots')==16 and d.get('completed_slots')==16 and d.get('real_ir_ready') is (profile=='ready')
                       and d.get('real_sqlite') is True and d.get('necessary_source_owners_seeded',0)>0
                       and d.get('necessary_source_bytes_unchanged') is True and d.get('actions_observed')==0
                       and d.get('process_evidence_worker_windows_thread_started') is True
                       and d.get('network_transport_initialized') is False and d.get('source_ack_inferred') is False,
                       'worker_isolated_coverage')
                  need([record.get('stage') for record in stages]==list(range(1,39)), 'stage_inventory')
                  for index in (7,8,27,28):
                      need(type(stages[index-1].get('calls')) is int and stages[index-1]['calls']>0, 'windows_core_branch_not_entered')
              accepted=True
          except BaseException as problem:
              failure=failure or type(problem).__name__+':'+str(problem)
          save('receipt.json', dict(identity, accepted=accepted and failure is None, parent_pid=child.pid if child else None,
                                   parent_returncode=code, elapsed_seconds=time.monotonic()-started,
                                   failure=failure, parent_rows=rows, streams=streams,
                                   real_service_or_endpoint_executed=False, full_agent_acceptance=False))
          print(json.dumps(dict(accepted=accepted and failure is None, parent_returncode=code, failure=failure)),flush=True)
          raise SystemExit(0 if accepted and failure is None else 1)
          '@
          python -B -c $probe '${{ matrix.arch }}'
          if ($LASTEXITCODE -ne 0) { throw 'Bounded pipeline diagnostic failed; fixed raw logs are preserved' }
      - name: Preserve bounded pipeline diagnostics only
        if: ${{ always() && (steps.pipeline-stop-diag.outcome == 'success' || steps.pipeline-stop-diag.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: preprocess-stop-boundary-${{ matrix.arch }}-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          path: |
            ${{ runner.temp }}/preprocess-stop-boundary-profile/intent.json
            ${{ runner.temp }}/preprocess-stop-boundary-profile/receipt.json
            ${{ runner.temp }}/preprocess-stop-boundary-profile/parent.stdout.log
            ${{ runner.temp }}/preprocess-stop-boundary-profile/parent.stderr.log
            ${{ runner.temp }}/preprocess-stop-boundary-profile/pipeline-stop-16-ready/worker.stdout.log
            ${{ runner.temp }}/preprocess-stop-boundary-profile/pipeline-stop-16-ready/worker.stderr.log
            ${{ runner.temp }}/preprocess-stop-boundary-profile/pipeline-stop-16-missing/worker.stdout.log
            ${{ runner.temp }}/preprocess-stop-boundary-profile/pipeline-stop-16-missing/worker.stderr.log
            contract-build/tests/pipeline-stop-generated/SOURCE-TRANSFORM-v2.json
            contract-build/tests/pipeline-stop-source-closure-*.txt
      # The earlier passed-tools artifact covers only contracts + sliced gates.
      # These opt-in profiles independently gate this whole workflow; no retry.
      - name: Build the unshipped real Service diagnostic Agent
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.diagnose_service_stop && matrix.arch == 'arm64' }}
        id: service-stop-build
        timeout-minutes: 5
        shell: pwsh
        run: |
          # The same-source Core7 projection/preparation contracts ran before
          # dependency work; keep the native-only consumers here.
          python -B tests/pipeline_stop_diag/test_collect_service_diagnostic.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Selected SCM metadata boundary regression failed' }
          python -B tests/pipeline_stop_diag/test_stage_ci_agent.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Bounded dependency failure projection regression failed' }
          cmake --build contract-build --config Release --target test_service_stop_agent --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'Unshipped real Service diagnostic Agent failed to build' }
      - name: Run one bounded isolated ARM64 Service diagnosis
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.diagnose_service_stop && matrix.arch == 'arm64' }}
        id: service-stop
        timeout-minutes: 6
        shell: pwsh
        run: |
          $token = [Guid]::NewGuid().ToString('N')
          "token=$token" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          $agent = Join-Path $env:GITHUB_WORKSPACE 'contract-build/tests/service-stop-agent/FDSensor.exe'
          $prefix = Join-Path $env:GITHUB_WORKSPACE 'vcpkg_installed/${{ matrix.triplet }}'
          $redistArch = Join-Path $env:VCToolsRedistDir '${{ matrix.msvc_arch }}'
          $redist = @(Get-ChildItem -LiteralPath $redistArch -Directory -Filter 'Microsoft.VC*.CRT')
          if ($redist.Count -ne 1) { throw 'One architecture-specific compiler CRT owner required' }
          $driver = Join-Path $env:GITHUB_WORKSPACE 'tests/cache-recovery/windows_cache_recovery_ci.ps1'
          $stager = Join-Path $env:GITHUB_WORKSPACE 'scripts/stage_retention_native_tools.py'
          $adapter = Join-Path $env:GITHUB_WORKSPACE 'tests/pipeline_stop_diag/stage_ci_agent.py'
          $template = Join-Path $env:GITHUB_WORKSPACE 'config/agent_windows_production.example.toml'
          $nativeManifest = Join-Path $env:RUNNER_TEMP 'evidence-native-tools/manifest.json'
          function Pin([string]$Path) { (Get-FileHash -LiteralPath $Path -Algorithm SHA256).Hash.ToLowerInvariant() }
          & ./tests/pipeline_stop_diag/diagnose_service_once.ps1 -Token $token -SourceSha $env:GITHUB_SHA -Architecture '${{ matrix.arch }}' `
            -AgentPath $agent -AgentSha256 (Pin $agent) -DllRoots @((Join-Path $prefix 'bin'), $redist[0].FullName) `
            -DumpbinPath (Get-Command dumpbin.exe -ErrorAction Stop).Source -PythonPath (Get-Command python.exe -ErrorAction Stop).Source `
            -QADriverSha256 (Pin $driver) -NativeStagerSha256 (Pin $stager) -StageAdapterSha256 (Pin $adapter) `
            -NativeToolManifestPath $nativeManifest -NativeToolManifestSha256 (Pin $nativeManifest) `
            -ConfigTemplatePath $template -ConfigTemplateSha256 (Pin $template)
          if ($LASTEXITCODE -ne 0) { throw 'Isolated Service stop failed or is unknown; preserve the original result' }
      - name: Select bounded Service metadata without Agent logs or databases
        if: ${{ always() && matrix.arch == 'arm64' && steps.service-stop.outputs.token != '' }}
        id: service-stop-metadata
        timeout-minutes: 1
        shell: pwsh
        run: |
          $token = '${{ steps.service-stop.outputs.token }}'
          python -B tests/pipeline_stop_diag/collect_service_diagnostic.py `
            --case "$env:RUNNER_TEMP/edr-ci-service-$token" --output "$env:RUNNER_TEMP/service-stop-qa-$token" `
            --source $env:GITHUB_SHA --token $token
          if ($LASTEXITCODE -ne 0) { throw 'Selected SCM metadata collection failed; no raw Agent logs may be substituted' }
      - name: Preserve only selected Service diagnostic metadata and source proof
        if: ${{ always() && matrix.arch == 'arm64' && (steps.service-stop-build.outcome == 'success' || steps.service-stop-build.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: isolated-service-stop-arm64-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          path: |
            ${{ runner.temp }}/service-stop-qa-${{ steps.service-stop.outputs.token }}/*.json
            contract-build/tests/service-stop-generated/SERVICE-SOURCE-TRANSFORM-v2.json
            contract-build/tests/service-stop-generated/SERVICE-CACHE-SOURCE-TRANSFORM-v2.json
            contract-build/tests/service-stop-source-closure-*.txt
      - name: Run native critical reserve load profiles
        id: critical-load
        timeout-minutes: 8
        shell: pwsh
        run: |
          $prefix = Join-Path $env:GITHUB_WORKSPACE 'vcpkg_installed/${{ matrix.triplet }}'
          $env:PATH = (Join-Path $prefix 'bin') + ';' + $env:PATH
          $probe = @'
          import datetime, hashlib, json, os, pathlib, subprocess, sys, time
          root = pathlib.Path(os.environ['GITHUB_WORKSPACE'])
          logs = pathlib.Path(os.environ['RUNNER_TEMP'])/'queue-critical-load'
          logs.mkdir(exist_ok=False)
          exe = root/'contract-build/tests/test_queue_recovery.exe'
          profiles = ('short32', 'max32', 'mixed512')
          cap = 8*1024*1024

          def save(path, value):
              with path.open('x', encoding='utf-8') as output:
                  json.dump(value, output, sort_keys=True, indent=2)
                  output.write('\n')

          def digest(raw):
              return hashlib.sha256(raw).hexdigest()

          identity = dict(source_sha=os.environ['GITHUB_SHA'], run_id=os.environ['GITHUB_RUN_ID'], run_attempt=os.environ['GITHUB_RUN_ATTEMPT'], arch=sys.argv[1], exe_sha256=digest(exe.read_bytes()), test_source_sha256=digest((root/'tests/test_queue_recovery.c').read_bytes()))
          save(logs/'intent.json', dict(identity, profiles=profiles, maximum_seconds_each=140, combined_log_cap=cap, automatic_retry=False, native_fixture_only=True))
          for index, profile in enumerate(profiles):
              case = logs/profile
              case.mkdir()
              env = {k:v for k,v in os.environ.items() if not k.upper().startswith('EDR_')}
              env['TMP'] = env['TEMP'] = str(case)
              stdout, stderr = logs/(profile+'.stdout.log'), logs/(profile+'.stderr.log')
              argv = [str(exe), '--critical-reserve-load', profile]
              child = None
              code = None
              failure = None
              began = time.monotonic()
              started_utc = datetime.datetime.now(datetime.timezone.utc).isoformat()
              with stdout.open('xb') as output, stderr.open('xb') as error:
                  try:
                      child = subprocess.Popen(argv, cwd=case, env=env, stdout=output, stderr=error)
                      while child.poll() is None:
                          if time.monotonic()-began >= 140:
                              failure = 'profile_timeout'
                              break
                          if stdout.stat().st_size+stderr.stat().st_size > cap:
                              failure = 'combined_log_cap'
                              break
                          time.sleep(.1)
                  except BaseException as error:
                      failure = 'observer_'+type(error).__name__
                  finally:
                      if child is not None:
                          try:
                              if child.poll() is None:
                                  child.kill()
                              code = child.wait(timeout=10)
                          except BaseException as error:
                              failure = 'terminal_unknown_'+type(error).__name__
              streams = {}
              bodies = {}
              for name, path in (('stdout',stdout), ('stderr',stderr)):
                  before = path.stat()
                  with path.open('rb') as stream:
                      raw = stream.read(cap+1)
                  after = path.stat()
                  stable = (before.st_ino,before.st_size,before.st_mtime_ns)==(after.st_ino,after.st_size,after.st_mtime_ns)
                  complete = code is not None and stable and after.st_size==len(raw)
                  streams[name] = dict(bytes=after.st_size, sha256=digest(raw), sha256_scope='complete_file' if complete else 'prefix_or_unverified', stable_after_child=stable)
                  bodies[name] = raw
              if failure is None and any(row['sha256_scope']!='complete_file' for row in streams.values()):
                  failure = 'capture_unverified'
              if streams['stdout']['bytes']+streams['stderr']['bytes'] > cap:
                  failure = failure or 'combined_log_cap'
              if code == 0 and failure is None:
                  try:
                      ends = [json.loads(line) for line in bodies['stdout'].splitlines() if line.startswith(b'{"kind":"critical_load_end",')]
                      if len(ends)!=1 or ends[0].get('profile')!=profile or ends[0].get('producers')!=4 or ends[0].get('local_sources_acknowledged')!=0 or ends[0].get('network') is not False or ends[0].get('rule_or_action_executed') is not False:
                          failure = 'profile_end_contract'
                  except (ValueError, UnicodeError):
                      failure = 'profile_end_invalid'
              elif failure is None:
                  failure = 'profile_exit_nonzero_or_unknown'
              record = dict(identity, profile=profile, argv=argv, started_utc=started_utc, elapsed_seconds=time.monotonic()-began, child_pid=child.pid if child is not None else None, returncode=code, terminal_known=code is not None, failure=failure, streams=streams, unstarted_profiles_after_first_failure=list(profiles[index+1:]) if failure else [], retry=False)
              save(logs/(profile+'.result.json'), record)
              print(json.dumps(dict(profile=profile, returncode=code, failure=failure, elapsed_seconds=record['elapsed_seconds'])), flush=True)
              if failure:
                  raise SystemExit(1)
          '@
          python -B -c $probe '${{ matrix.arch }}'
          if ($LASTEXITCODE -ne 0) { throw 'Native critical reserve load failed; inspect the preserved profile logs' }
      - name: Equal-input native evidence and pressure comparisons
        id: comparisons
        shell: pwsh
        run: |
          $results = Join-Path $env:RUNNER_TEMP 'retention-results'
          if (Test-Path -LiteralPath $results) { throw 'Synthetic result directory must be new' }
          $prefix = Join-Path $env:GITHUB_WORKSPACE 'vcpkg_installed/${{ matrix.triplet }}'
          python -B tests/run_evidence_retention_comparison.py --output "$results/evidence" --baseline 0ae3fb28e553223358db1a83ebd26432336af9e7 --runs 5 --dependency-prefix "$prefix" --native-machine '${{ matrix.arch }}'
          if ($LASTEXITCODE -ne 0) { throw 'Native evidence comparison failed; inspect preserved logs' }
          python -B tests/run_queue_retention_comparison.py --output "$results/queue" --dependency-prefix "$prefix" --native-machine '${{ matrix.arch }}' --scenarios unique replay high_severity owner_loss
          if ($LASTEXITCODE -ne 0) { throw 'Native queue pressure comparison failed; inspect preserved logs' }
      - name: Preserve measurements and failure logs only
        if: ${{ always() && (steps.comparisons.outcome == 'success' || steps.comparisons.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: evidence-retention-native-${{ matrix.arch }}-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ runner.temp }}/retention-results/**/*.json
            ${{ runner.temp }}/retention-results/**/*.jsonl
            ${{ runner.temp }}/retention-results/**/*.log
      - name: Preserve native contract results separately
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-contracts-native-${{ matrix.arch }}-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            contract-build/native-release-results.xml
            contract-build/native-release-LastTest.log
            contract-build/native-telemetry-results.xml
            contract-build/Testing/Temporary/LastTest.log
            contract-build/windows-rule-audit-result.json
            ${{ runner.temp }}/retention-sliced-contract/*.log
            ${{ runner.temp }}/queue-critical-load/*.log
            ${{ runner.temp }}/queue-critical-load/*.json
