# 独立 edr-agent 仓库：仅构建 Windows 客户端产物（exe + 运行时 DLL zip），不创建 GitHub Release。
# 正式发版请推 win_* tag 触发 edr-agent-client-release.yml。
# 首步 `./scripts/verify_ave_behavior_chain_invariants.sh`（与 monorepo 同锚点，**无**编译）。

name: edr-agent client build (Windows)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: edr-agent-client-build-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  VCPKG_DEFAULT_TRIPLET: x64-windows
  VCPKG_DOWNLOADS: ${{ github.workspace }}/.cache/vcpkg-downloads
  VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/.cache/vcpkg-bincache,readwrite"

jobs:
  windows-build:
    name: Build Windows (FDSensor.exe, fast by default)
    runs-on: windows-2022
    timeout-minutes: 360
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Validate release scripts with Windows PowerShell 5.1
        shell: powershell
        run: .\scripts\validate_windows_powershell_syntax.ps1
      - name: Verify locked Setup UI NuGet closure and publish before native dependency build
        shell: pwsh
        run: .\scripts\Restore-SetupUiLocked.ps1 -RuntimeIdentifier win-x64 -SelfContained true -PublishReadyToRun false -Configuration Release -VerifyPublish
      - name: AVE / behavior chain invariants (no vcpkg, bash)
        shell: bash
        run: |
          chmod +x ./scripts/verify_ave_behavior_chain_invariants.sh
          ./scripts/verify_ave_behavior_chain_invariants.sh

      - name: Resolve agent version
        shell: pwsh
        run: |
          $ref = '${{ github.ref_name }}'
          if ($ref -match '_(\d+\.\d+\.\d+)$') {
            $ver = $Matches[1]
          } elseif ($ref -match '^(\d+\.\d+\.\d+)$') {
            $ver = $Matches[1]
          } else {
            $cmake = [System.IO.File]::ReadAllText((Join-Path $env:GITHUB_WORKSPACE "CMakeLists.txt"))
            if ($cmake -match '(?s)project\(\s*edr_agent\b.*?\bVERSION\s+(\d+\.\d+\.\d+)') {
              $ver = $Matches[1]
            } else {
              $ver = "0.1.0"
            }
            Write-Warning "Cannot extract semver from ref '$ref'; using project default $ver"
          }
          "EDR_AGENT_VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append
          [System.IO.File]::WriteAllText((Join-Path $env:GITHUB_WORKSPACE "VERSION"), $ver)
          Write-Host "Agent version: $ver"

      - name: Initialize pinned Visual Studio 2022 environment
        shell: pwsh
        run: .\scripts\Initialize-VS2022Environment.ps1 -Architecture x64
      # P0 bundle generation is architecture-independent.  Use the x64 Python
      # wheel on every Windows runner, including ARM64, so cryptography never
      # silently falls back to a Rust/source build.
      - name: Set up pinned Python for release tools
        uses: actions/setup-python@v6
        with:
          python-version: '3.12.10'
          architecture: x64
      - name: Install pinned P0 encryption dependency
        shell: pwsh
        run: |
          python --version
          python -m pip install --disable-pip-version-check --only-binary=:all: --requirement .\requirements-release.txt
          python -c "from cryptography.hazmat.primitives.ciphers.aead import AESGCM; print('cryptography AESGCM ready')"
      - name: Install build tools
        shell: pwsh
        run: choco install ninja innosetup -y --no-progress
      - name: Prepare vcpkg cache directories
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path (Join-Path $env:GITHUB_WORKSPACE '.cache/vcpkg-downloads') | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $env:GITHUB_WORKSPACE '.cache/vcpkg-bincache') | Out-Null

      - name: Prepare P0 rule bundle
        shell: pwsh
        run: python .\scripts\prepare_p0_release_bundle.py

      # Do not restore vcpkg_installed across jobs: its status file can make
      # vcpkg skip validation after a runner/compiler image change. Downloads
      # and ABI-keyed binary packages are reused; installed state is always
      # materialized by this job through mandatory vcpkg ABI validation.
      - name: Identify vcpkg cache toolchain
        id: vcpkg-key
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p 'test_vcpkg_*cache*.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'vcpkg cache regression failed' }
          & .\tests\test_vcpkg_install_retry.ps1
          & .\tests\test_vs2022_host_architecture.ps1
          python .\scripts\vcpkg_cache_key.py --triplet x64-windows
      - name: Cache vcpkg source and binary downloads
        id: vcpkg-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            .cache/vcpkg-downloads
            .cache/vcpkg-bincache
          key: ${{ steps.vcpkg-key.outputs.key }}
          restore-keys: |
            ${{ steps.vcpkg-key.outputs.restore-prefix }}
            vcpkg-x64-win-yara-
            vcpkg-prebuild-yara-x64-windows-

      - name: Restore shared vcpkg dependency cache
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python .\scripts\vcpkg_release_cache.py restore --key '${{ steps.vcpkg-key.outputs.key }}' --actions-cache-hit '${{ steps.vcpkg-cache.outputs.cache-hit }}'
          if ($LASTEXITCODE -ne 0) { throw 'Shared dependency cache restore failed' }

      - name: "[Timing] Build start"
        shell: pwsh
        run: |
          $start = Get-Date
          "BUILD_TIMING_START=$($start.ToString('o'))" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Build started at $($start.ToString('HH:mm:ss'))"

      - name: Bootstrap pinned vcpkg
        working-directory: ${{ github.workspace }}
        shell: pwsh
        run: .\scripts\bootstrap_pinned_vcpkg.ps1

      - name: vcpkg install (manifest)
        working-directory: ${{ github.workspace }}
        env:
          VCPKG_DEFAULT_TRIPLET: x64-windows
        shell: pwsh
        run: |
          if (-not (Test-Path "vcpkg.json")) { throw "missing vcpkg.json" }
          $installed_marker = Join-Path $env:GITHUB_WORKSPACE "vcpkg_installed\vcpkg\status"
          if (Test-Path $installed_marker) {
            Write-Host "[vcpkg] Packages already installed (from $env:VCPKG_SOURCE), verifying..."
          }
          $vroot = (Join-Path $env:GITHUB_WORKSPACE "vcpkg")
          $env:VCPKG_ROOT = $vroot
          $env:Path = $vroot + ";" + $env:Path
          $tc = Join-Path $vroot "vcpkg.exe"
          if (-not (Test-Path -LiteralPath $tc)) { throw "missing vcpkg.exe" }
          Write-Host "[vcpkg] Windows product build: sqlite + yara (no gRPC)"
          & .\scripts\Invoke-VcpkgInstallWithRetry.ps1 -VcpkgExe $tc -FeatureArgs @('--x-feature=sqlite', '--x-feature=yara') -MaxAttempts 6 -InitialBackoffSeconds 30
          "VCPKG_INSTALLED_X64=" + (Join-Path $env:GITHUB_WORKSPACE "vcpkg_installed\x64-windows") | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Save completed vcpkg dependencies
        if: steps.vcpkg-cache.outputs.cache-hit != 'true' && hashFiles('.cache/vcpkg-bincache/**/*.zip') != ''
        uses: actions/cache/save@v5
        with:
          path: |
            .cache/vcpkg-downloads
            .cache/vcpkg-bincache
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Configure (Ninja, Release)
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
        shell: pwsh
        run: |
          $tcf = (Join-Path $env:VCPKG_ROOT "scripts\buildsystems\vcpkg.cmake")
          if (-not (Test-Path -LiteralPath $tcf)) { throw "toolchain: $tcf" }
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$tcf" `
            "-DCMAKE_PREFIX_PATH=$env:GITHUB_WORKSPACE/vcpkg_installed/x64-windows" `
            "-DVCPKG_MANIFEST_FEATURES=yara" `
            "-DEDR_AGENT_VERSION_STRING=$env:EDR_AGENT_VERSION" `
            "-DEDR_PCRE2_PRODUCER_TARGET=windows/amd64" `
            "-DEDR_PCRE2_VCPKG_ROOT=$env:VCPKG_ROOT" `
            -DEDR_WITH_INGEST_HTTPS_OPENSSL=ON `
            -DEDR_WITH_P0_RULES_OPENSSL=ON `
            -DEDR_REQUIRE_SQLITE=ON `
            "-DVCPKG_INSTALLED_DIR=$env:GITHUB_WORKSPACE/vcpkg_installed" `
            -DEDR_WITH_YARA=ON `
            -DEDR_REQUIRE_YARA=ON `
            -DEDR_BUILD_TESTS=ON
          if (-not $?) { throw "cmake configure failed" }

      - name: Verify YARA compile definition generated
        shell: pwsh
        run: |
          $generated = @("build\build.ninja", "build\CMakeFiles\edr_agent.dir\flags.make") | Where-Object { Test-Path -LiteralPath $_ }
          if (-not $generated) { throw "No generated build metadata found under build; cannot verify EDR_HAVE_YARA=1" }
          $hasYara = $false
          foreach ($p in $generated) {
            if (Select-String -Path $p -SimpleMatch "EDR_HAVE_YARA=1" -Quiet) { $hasYara = $true; break }
          }
          if (-not $hasYara) { throw "Generated build files do not contain EDR_HAVE_YARA=1" }

      - name: Verify release gate build dependencies
        env:
          # Nested CMake probes must use the same dependency prefix as Configure.
          CMAKE_PREFIX_PATH: ${{ env.VCPKG_INSTALLED_X64 }}
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p test_windows_release_gate.py -v
          if ($LASTEXITCODE -ne 0) { throw "Windows release gate dependency regression failed" }
          python tests/test_pcre2_cmake_gate.py PCRE2CMakeGateTests.test_static_matcher_header_wins_over_shared_dependency_prefix -v
          if ($LASTEXITCODE -ne 0) { throw "Windows PCRE2 header isolation regression failed" }

      - name: Build (Ninja)
        shell: pwsh
        run: |
          $buildTargets = @(
            'edr_agent',
            'forensic_collector',
            'fd_installer_worker',
            'fd_headless_uninstaller',
            'windows_release_gate_tests'
          )
          # Report independent build failures together; Ninja still exits nonzero.
          cmake --build build --config Release --target $buildTargets --parallel $env:NUMBER_OF_PROCESSORS --verbose -- -k 0
          if ($LASTEXITCODE -ne 0) {
            throw "Windows product or gate-test build failed with exit code $LASTEXITCODE"
          }

      - name: Verify native uninstall attestation capabilities
        shell: pwsh
        run: |
          $outDir = @("build\Release", "build") | Where-Object {
            Test-Path -LiteralPath (Join-Path $_ "FDSecurityInstallerWorker.exe")
          } | Select-Object -First 1
          if (-not $outDir) { throw "native installer worker output directory not found" }
          $workerProbe = Join-Path $env:RUNNER_TEMP "installer-worker-capabilities.json"
          $uninstallerProbe = Join-Path $env:RUNNER_TEMP "headless-uninstaller-capabilities.json"
          $probeRunner = Resolve-Path ".\scripts\invoke_windows_native_capability_probe.ps1"
          $worker = & $probeRunner `
            -ExecutablePath (Join-Path $outDir "FDSecurityInstallerWorker.exe") `
            -ProbePath $workerProbe `
            -ComponentName "installer worker"
          $uninstaller = & $probeRunner `
            -ExecutablePath (Join-Path $outDir "uninstall.exe") `
            -ProbePath $uninstallerProbe `
            -ComponentName "headless uninstaller" `
            -RequireSelfContainedMsvcRuntime
          if ($worker.uninstall_attestation -ne "v3" -or $worker.native_in_memory_token_handoff -ne $true) {
            throw "installer worker does not implement native in-memory uninstall attestation v3 handoff"
          }
          if ($uninstaller.uninstall_attestation -ne "v3" -or $uninstaller.native_in_memory_token_handoff -ne $true) {
            throw "headless uninstaller does not implement native in-memory uninstall attestation v3 handoff"
          }

      - name: Verify HTTPS REST and SQLite compiled in
        shell: pwsh
        run: |
          $exe = @("build\FDSensor.exe", "build\Release\FDSensor.exe") | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $exe) { throw "FDSensor.exe not found after build" }
          $text = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes((Resolve-Path $exe)))
          if ($text.Contains("https requested but OpenSSL disabled")) { throw "missing HTTPS REST OpenSSL support" }
          if ($text.Contains("sqlite disabled")) { throw "missing SQLite local storage support" }
          if (-not $env:EDR_AGENT_VERSION) {
            throw "EDR_AGENT_VERSION was not resolved"
          }
          if (-not $text.Contains($env:EDR_AGENT_VERSION)) {
            throw "FDSensor.exe does not contain agent version '$env:EDR_AGENT_VERSION'"
          }
          if ($text.Contains("0.3.0")) {
            throw "FDSensor.exe still contains legacy agent version fallback 0.3.0"
          }
          if ($text.Contains("This Agent build does not include libyara-backed YARA support")) {
            throw "FDSensor.exe was built without libyara-backed YARA support"
          }

      - name: Stage vcpkg + MSVC runtime DLLs
        shell: pwsh
        run: |
          $env:VCPKG_INSTALLED_X64 = (Join-Path $env:GITHUB_WORKSPACE "vcpkg_installed\x64-windows")
          ./scripts/stage_vcpkg_runtime_dlls_build_release.ps1
          ./scripts/stage_msvc_runtime_dlls_build_release.ps1 -Architecture amd64
          ./scripts/stage_windivert_runtime.ps1 -DestinationDir "build\Release"

          $stagedYara = @(Get-ChildItem -Path "build\Release" -Filter "*.dll" -File -ErrorAction SilentlyContinue | Where-Object { $_.Name -match '(?i)yara.*\.dll$' })
          if (-not $stagedYara -or $stagedYara.Count -lt 1) {
            Write-Warning "No YARA runtime DLL staged; vcpkg libyara may be static for x64-windows."
          } else {
            Write-Host "Verified staged YARA runtime DLL(s): $($stagedYara.Name -join ', ')"
          }

      - name: Test
        shell: pwsh
        run: |
          & ctest --test-dir build -C Release --output-on-failure --no-tests=error --label-regex '^windows-release-gate$'
          if ($LASTEXITCODE -ne 0) { throw "Client build gate tests failed" }

      - name: "[Timing] Build summary"
        if: always()
        shell: pwsh
        run: |
          if ($env:BUILD_TIMING_START) {
            $start = [DateTime]::Parse($env:BUILD_TIMING_START)
            $elapsed = (Get-Date) - $start
            Write-Host "========================================"
            Write-Host "Total elapsed build time: $($elapsed.TotalMinutes.ToString('F1')) minutes ($($elapsed.TotalSeconds)s)"
            Write-Host "vcpkg source : $env:VCPKG_SOURCE"
            $installed_marker = Join-Path $env:GITHUB_WORKSPACE "vcpkg_installed\vcpkg\status"
            if (Test-Path $installed_marker) {
              $size = [math]::Round(((Get-ChildItem -Path "vcpkg_installed" -Recurse -File | Measure-Object -Property Length -Sum).Sum / 1MB), 1)
              Write-Host "vcpkg installed size: ${size} MB"
            }
            Write-Host "========================================"
          }

      - name: Package (setup exe + runtime zip)
        shell: pwsh
        run: |
          $zip = "edr-agent-${{ github.ref_name }}-windows-amd64-exe.zip"
          $outDir = $null
          $agentExe = $null
          foreach ($c in @("build\Release", "build")) {
            $preferred = Join-Path $c "FDSensor.exe"
            if (Test-Path -LiteralPath $preferred) {
              $outDir = $c
              $agentExe = $preferred
              break
            }
          }
          if (-not $outDir -or -not $agentExe) { throw "missing FDSensor.exe under build\Release or build" }
          $workerExe = Join-Path $outDir "FDSecurityInstallerWorker.exe"
          if (-not (Test-Path -LiteralPath $workerExe)) {
            $foundWorker = Get-ChildItem -Path build -Recurse -Filter "FDSecurityInstallerWorker.exe" -File -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName -First 1
            if ($foundWorker) {
              Copy-Item -LiteralPath $foundWorker -Destination $workerExe -Force
            }
          }
          $items = New-Object System.Collections.Generic.List[string]
          if (-not (Test-Path "VERSION")) {
            [System.IO.File]::WriteAllText((Join-Path $env:GITHUB_WORKSPACE "VERSION"), $env:EDR_AGENT_VERSION)
          }
          [System.IO.File]::WriteAllText((Join-Path $outDir "VERSION"), $env:EDR_AGENT_VERSION)
          $null = $items.Add($agentExe)
          if ($workerExe -and (Test-Path -LiteralPath $workerExe)) {
            $null = $items.Add($workerExe)
          } else {
            throw "FDSecurityInstallerWorker.exe not found after build"
          }
          $uninstallerExe = Join-Path $outDir "uninstall.exe"
          if (-not (Test-Path -LiteralPath $uninstallerExe)) {
            $foundUninstaller = Get-ChildItem -Path build -Recurse -Filter "uninstall.exe" -File -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName -First 1
            if ($foundUninstaller) { Copy-Item -LiteralPath $foundUninstaller -Destination $uninstallerExe -Force }
          }
          if (-not (Test-Path -LiteralPath $uninstallerExe)) { throw "headless uninstall.exe not found after build" }
          $null = $items.Add($uninstallerExe)
          $nativeIntegrityPath = Join-Path $outDir "native-package-integrity.json"
          $nativeIntegrityFiles = New-Object System.Collections.Generic.List[object]
          $null = $nativeIntegrityFiles.Add([ordered]@{
            name = "FDSecurityInstallerWorker.exe"
            sha256 = (Get-FileHash -LiteralPath $workerExe -Algorithm SHA256).Hash.ToLowerInvariant()
          })
          $null = $nativeIntegrityFiles.Add([ordered]@{
            name = "uninstall.exe"
            sha256 = (Get-FileHash -LiteralPath $uninstallerExe -Algorithm SHA256).Hash.ToLowerInvariant()
          })
          [object[]]$nativeIntegrityFileArray = $nativeIntegrityFiles.ToArray()
          [ordered]@{
            schema = "edr.windows.native-package-integrity.v1"
            files = $nativeIntegrityFileArray
          } | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath $nativeIntegrityPath -Encoding UTF8
          $null = $items.Add($nativeIntegrityPath)
          $null = $items.Add((Join-Path $env:GITHUB_WORKSPACE "VERSION"))
          Get-ChildItem $outDir -Filter "*.dll" -File -ErrorAction SilentlyContinue | ForEach-Object { $null = $items.Add($_.FullName) }
          foreach ($p in @("WinDivert64.sys", "licenses\WinDivert-LICENSE.txt", "licenses\WinDivert-SOURCE.json")) {
            $asset = Join-Path $outDir $p
            if (-not (Test-Path -LiteralPath $asset)) { throw "missing staged WinDivert asset: $asset" }
            $null = $items.Add($asset)
          }
          foreach ($p in @(
            "scripts\edr_agent_install.ps1",
            "install\windows-inno\edr_windows_autorun.ps1",
            "scripts\edr_agent_preflight.ps1",
            "scripts\edr_agent_zip_deploy.ps1",
            "scripts\windows_service_install.ps1",
            "scripts\windows_isolate_host.ps1",
            "config\agent_windows_production.example.toml"
          )) {
            if (Test-Path $p) { $null = $items.Add($p) }
          }
          $runtimeDetectionStagingRoot = Join-Path $env:RUNNER_TEMP "edr-runtime-detection"
          $runtimeDetectionDir = Join-Path $runtimeDetectionStagingRoot "edr_config"
          Remove-Item -LiteralPath $runtimeDetectionStagingRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $runtimeDetectionDir -Force | Out-Null
          foreach ($detectionAssetName in @("p0_rule_bundle_ir_v1.json.enc", "sensor_interest_manifest.json")) {
            $detectionAssetSource = Join-Path "config" $detectionAssetName
            if (-not (Test-Path -LiteralPath $detectionAssetSource -PathType Leaf)) {
              throw "missing required detection asset: $detectionAssetSource"
            }
            if ((Get-Item -LiteralPath $detectionAssetSource).Length -le 0) {
              throw "required detection asset is empty: $detectionAssetSource"
            }
            Copy-Item -LiteralPath $detectionAssetSource -Destination (Join-Path $runtimeDetectionDir $detectionAssetName) -Force
          }
          $null = $items.Add($runtimeDetectionDir)
          $forensicRulesDir = "rules\forensic"
          $requiredForensicRules = @(
            "credential_theft.yar",
            "injection.yar",
            "lateral_movement.yar",
            "packers.yar",
            "privilege_escalation.yar",
            "suspicious.yar"
          )
          foreach ($rule in $requiredForensicRules) {
            $rulePath = Join-Path $forensicRulesDir $rule
            if (-not (Test-Path -LiteralPath $rulePath -PathType Leaf)) {
              throw "missing forensic YARA rule for headless package: $rulePath"
            }
          }
          $null = $items.Add((Resolve-Path -LiteralPath "rules").Path)

          $innoOut = "install\windows-inno\Output"
          Remove-Item -LiteralPath $innoOut -Recurse -Force -ErrorAction SilentlyContinue
          & ".\install\windows-inno\Build-BundledInstaller.ps1" -BinDir (Resolve-Path $outDir).Path -AppVersion $env:EDR_AGENT_VERSION -TargetArch amd64
          if ($LASTEXITCODE -ne 0) { throw "Inno setup build failed" }
          $setupSrc = Join-Path $innoOut "FDSecuritySetup-bundled.exe"
          if (-not (Test-Path -LiteralPath $setupSrc)) {
            $setupSrc = Join-Path $innoOut "EDRAgentSetup-bundled.exe"
          }
          if (-not (Test-Path -LiteralPath $setupSrc)) { throw "missing bundled setup exe: $setupSrc" }
          $setupDest = Join-Path $env:GITHUB_WORKSPACE "edr_agent_setup.exe"
          Copy-Item -LiteralPath $setupSrc -Destination $setupDest -Force
          $setupArchSrc = $setupSrc + ".arch"
          if (-not (Test-Path -LiteralPath $setupArchSrc)) { throw "missing setup architecture metadata: $setupArchSrc" }
          Copy-Item -LiteralPath $setupArchSrc -Destination ($setupDest + ".arch") -Force
          $null = $items.Add($setupDest)

          $setupUiZip = Join-Path $env:GITHUB_WORKSPACE "edr_agent_setup_ui.zip"
          $agentBinarySha256 = (Get-FileHash -LiteralPath (Join-Path $outDir "FDSensor.exe") -Algorithm SHA256).Hash.ToLowerInvariant()
          & ".\install\windows-setup-ui\Build-SetupUi.ps1" -SetupExe $setupDest -AppVersion $env:EDR_AGENT_VERSION -AgentBinarySha256 $agentBinarySha256 -RuntimeIdentifier win-x64 -SetupTargetArch amd64 -OutputZip $setupUiZip
          if ($LASTEXITCODE -ne 0) { throw "Setup UI build failed" }
          if (-not (Test-Path -LiteralPath $setupUiZip)) { throw "missing setup UI package: $setupUiZip" }
          Write-Host "Setup UI package is uploaded as a separate artifact and is not nested into the runtime zip."

          Compress-Archive -Path $items.ToArray() -DestinationPath $zip -Force
          if (-not (Test-Path -LiteralPath $zip)) { throw "package was not created: $zip" }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zipObj = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $zip))
          try {
            $entries = $zipObj.Entries.FullName
            $normalizedEntries = @($entries | ForEach-Object { $_.Replace('\', '/') })
            if ($entries -match '(^|/|\\)p0_rule_bundle_ir_v1\.json$') {
              throw "plaintext P0 rule bundle must not be packaged"
            }
            if ($entries -match '(^|/|\\)p0_rule_bundle_manifest\.json$') {
              throw "plaintext P0 rule manifest must not be packaged"
            }
            $encryptedP0Entries = @($normalizedEntries | Where-Object { $_ -eq 'edr_config/p0_rule_bundle_ir_v1.json.enc' })
            if ($encryptedP0Entries.Count -ne 1) {
              throw "package must contain exactly one edr_config/p0_rule_bundle_ir_v1.json.enc; found $($encryptedP0Entries.Count)"
            }
            $sensorManifestEntries = @($normalizedEntries | Where-Object { $_ -eq 'edr_config/sensor_interest_manifest.json' })
            if ($sensorManifestEntries.Count -ne 1) {
              throw "package must contain exactly one edr_config/sensor_interest_manifest.json; found $($sensorManifestEntries.Count)"
            }
            $forensicEntries = @($entries | Where-Object { $_ -match '(?i)^rules[/\\]forensic[/\\][^/\\]+\.yar(a)?$' })
            if ($forensicEntries.Count -lt 1) {
              throw "rules/forensic/*.yar missing from headless package"
            }
            $normalizedForensicEntries = @($forensicEntries | ForEach-Object { $_.Replace('\', '/').ToLowerInvariant() })
            foreach ($rule in $requiredForensicRules) {
              $expectedRuleEntry = "rules/forensic/$($rule.ToLowerInvariant())"
              if ($normalizedForensicEntries -notcontains $expectedRuleEntry) {
                throw "required forensic YARA rule missing from headless package: $rule"
              }
            }
            # rules/forensic/VERSION is the rule-bundle version, not the Agent version.
            $rootVersionEntries = @($zipObj.Entries | Where-Object { $_.FullName.Replace('\', '/') -eq 'VERSION' })
            if ($rootVersionEntries.Count -ne 1) {
              throw "package root must contain exactly one VERSION file; found $($rootVersionEntries.Count)"
            }
            $versionEntry = $rootVersionEntries[0]
            $reader = New-Object System.IO.StreamReader($versionEntry.Open())
            try {
              $packagedVersion = $reader.ReadToEnd().Trim()
            }
            finally {
              $reader.Dispose()
            }
            if ($packagedVersion -ne $env:EDR_AGENT_VERSION) {
              throw "VERSION mismatch in package: expected '$env:EDR_AGENT_VERSION', got '$packagedVersion'"
            }

            foreach ($requiredRootScript in @('edr_agent_install.ps1', 'edr_windows_autorun.ps1')) {
              $rootScriptEntries = @($zipObj.Entries | Where-Object { $_.FullName.Replace('\', '/') -eq $requiredRootScript })
              if ($rootScriptEntries.Count -ne 1) {
                throw "package root must contain exactly one $requiredRootScript; found $($rootScriptEntries.Count)"
              }
            }

            if (-not ($entries -match '(?i)(^|/|\\)(lib)?yara.*\.dll$')) {
              Write-Warning "No YARA runtime DLL in package; vcpkg libyara may be statically linked for x64-windows."
            }
            foreach ($runtimeDll in @('vcruntime140.dll', 'vcruntime140_1.dll', 'msvcp140.dll')) {
              $escapedRuntimeDll = [Regex]::Escape($runtimeDll)
              if (-not ($entries -match "(?i)(^|/|\\)$escapedRuntimeDll$")) {
                throw "required app-local MSVC runtime DLL missing from package: $runtimeDll"
              }
            }
            if (-not ($entries -match '(^|/|\\)edr_agent_setup\.exe$')) {
              throw "edr_agent_setup.exe missing from package"
            }
            foreach ($required in @(
              'edr_agent_install\.ps1',
              'edr_windows_autorun\.ps1',
              'edr_agent_preflight\.ps1',
              'edr_agent_zip_deploy\.ps1',
              'windows_service_install\.ps1',
              'windows_isolate_host\.ps1',
              'FDSecurityInstallerWorker\.exe',
              'uninstall\.exe',
              'native-package-integrity\.json',
              'WinDivert\.dll',
              'WinDivert64\.sys',
              'WinDivert-LICENSE\.txt',
              'agent_windows_production\.example\.toml'
            )) {
              if (-not ($entries -match "(^|/|\\)${required}$")) {
                throw "required package entry missing: $required"
              }
            }
          }
          finally {
            $zipObj.Dispose()
          }

      - name: Move artifact to workspace
        shell: pwsh
        run: |
          $src = "edr-agent-${{ github.ref_name }}-windows-amd64-exe.zip"
          if (-not (Test-Path -LiteralPath $src)) { throw "missing $src" }
          Copy-Item -Path $src -Destination (Join-Path $env:GITHUB_WORKSPACE "edr-agent-win-exe.zip") -Force
          if (-not (Test-Path -LiteralPath "edr_agent_setup.exe")) { throw "missing edr_agent_setup.exe" }
          if (-not (Test-Path -LiteralPath "edr_agent_setup_ui.zip")) { throw "missing edr_agent_setup_ui.zip" }

      - uses: actions/upload-artifact@v6
        with:
          name: edr-agent-windows-${{ github.ref_name }}
          path: |
            edr-agent-win-exe.zip
            edr_agent_setup.exe
            edr_agent_setup_ui.zip
          retention-days: 1
          if-no-files-found: error
