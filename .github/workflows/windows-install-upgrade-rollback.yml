name: Windows install upgrade rollback

on:
  workflow_call:
    inputs:
      target_tag:
        description: Target release tag
        required: true
        type: string
      baseline_tag:
        description: Published baseline; empty selects the newest older published release with complete assets for both architectures
        required: false
        default: ''
        type: string
      package_scope:
        description: Release asset scope; headless uses its hash-bound embedded installer
        required: false
        default: full
        type: string
      architecture:
        description: Native architecture to validate (all, amd64, or arm64)
        required: false
        default: all
        type: string
      native_repeat_count:
        description: Serial native runtime lifecycle rounds (1..5)
        required: false
        default: 1
        type: number
  workflow_dispatch:
    inputs:
      target_tag:
        description: Target release tag
        required: true
        type: string
      baseline_tag:
        description: Published baseline; empty selects the newest older published release with complete assets for both architectures
        required: false
        default: ''
        type: string
      package_scope:
        description: Release asset scope; headless uses its hash-bound embedded installer
        required: false
        default: full
        type: choice
        options:
          - full
          - headless
      architecture:
        description: Native architecture to validate (all, amd64, or arm64)
        required: false
        default: all
        type: choice
        options:
          - all
          - amd64
          - arm64
      native_repeat_count:
        description: Serial native runtime lifecycle rounds (1..5)
        required: false
        default: 1
        type: number
      cache_recovery_subset:
        description: 'Manual disposable exact 692-to-695 cache subset only; default keeps the existing lifecycle gate'
        required: false
        default: false
        type: boolean
      backend_builder_base64:
        description: 'Subset only: original backend builder canonical base64; fixed SHA695c9a0d'
        required: false
        default: ''
        type: string
      handler_verification_json:
        description: 'Subset only: actual original-handler verification; NOT platform HTTP authentication'
        required: false
        default: ''
        type: string
      handler_verification_sha256:
        description: 'Subset only: exact original-handler verification UTF8 SHA256'
        required: false
        default: ''
        type: string
      higher_min_free_bytes:
        description: 'Subset only: optional explicit higher floor; 0 uses actual native owner plus manifest minimum'
        required: false
        default: '0'
        type: string

permissions:
  # GitHub hides draft releases from tokens without push-level contents access.
  # This job never mutates a release, but it must read the target draft assets
  # before the publish gate can complete.
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: windows-lifecycle-${{ inputs.target_tag }}
  cancel-in-progress: false

jobs:
  native-lifecycle:
    if: ${{ !inputs.cache_recovery_subset }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.architecture == 'all' && '[{"arch":"amd64","runner":"windows-2022"},{"arch":"arm64","runner":"windows-11-arm"}]' || inputs.architecture == 'amd64' && '[{"arch":"amd64","runner":"windows-2022"}]' || inputs.architecture == 'arm64' && '[{"arch":"arm64","runner":"windows-11-arm"}]' || '[{"arch":"invalid","runner":"windows-2022"}]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6

      - name: Validate lifecycle inputs
        shell: pwsh
        env:
          LIFECYCLE_ARCHITECTURE: ${{ inputs.architecture }}
          LIFECYCLE_REPEAT_COUNT: ${{ inputs.native_repeat_count }}
          LIFECYCLE_MATRIX_ARCH: ${{ matrix.arch }}
          LIFECYCLE_PACKAGE_SCOPE: ${{ inputs.package_scope }}
        run: |
          $architecture = $env:LIFECYCLE_ARCHITECTURE
          if ($architecture -cnotin @('all', 'amd64', 'arm64')) {
            throw "invalid architecture input: $architecture"
          }
          if ($env:LIFECYCLE_MATRIX_ARCH -eq 'invalid') {
            throw "invalid lifecycle matrix architecture for input: $architecture"
          }
          if ($env:LIFECYCLE_PACKAGE_SCOPE -cnotin @('full', 'headless')) {
            throw "package_scope must be full or headless"
          }
          [int]$repeatCount = 0
          $repeatText = $env:LIFECYCLE_REPEAT_COUNT
          if (-not [int]::TryParse($repeatText, [ref]$repeatCount) -or $repeatCount -lt 1 -or $repeatCount -gt 5) {
            throw "native_repeat_count must be an integer in 1..5; got '$repeatText'"
          }
          "NATIVE_REPEAT_COUNT=$repeatCount" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Restore pinned ARM64-host Python tool cache
        if: matrix.arch == 'arm64'
        uses: actions/cache/restore@v5
        with:
          path: |
            ${{ runner.tool_cache }}/Python/3.12.10/x64
            ${{ runner.tool_cache }}/Python/3.12.10/x64.complete
          key: python-tool-${{ runner.os }}-${{ runner.arch }}-3.12.10-x64-v1
      - name: Set up pinned Python for baseline selection
        uses: actions/setup-python@v6
        with:
          python-version: '3.12.10'
          architecture: x64

      - name: Verify lifecycle package scope contract
        shell: pwsh
        run: python tests/test_windows_lifecycle_workflow.py

      - name: Resolve release tags
        shell: pwsh
        env:
          LIFECYCLE_TARGET_TAG: ${{ inputs.target_tag }}
          LIFECYCLE_BASELINE_TAG: ${{ inputs.baseline_tag }}
          LIFECYCLE_PACKAGE_SCOPE: ${{ inputs.package_scope }}
        run: |
          $target = $env:LIFECYCLE_TARGET_TAG.Trim()
          $requestedBaseline = $env:LIFECYCLE_BASELINE_TAG.Trim()
          $selectionArgs = @('select-baseline', '--target-tag', $target, '--package-scope', $env:LIFECYCLE_PACKAGE_SCOPE)
          if ($requestedBaseline) { $selectionArgs += @('--baseline-tag', $requestedBaseline) }
          $selectionJson = & python .\scripts\windows_release_checkpoint.py @selectionArgs
          if ($LASTEXITCODE -ne 0) { throw 'published Windows baseline selection failed' }
          $selectedBaseline = $selectionJson | ConvertFrom-Json -ErrorAction Stop
          if ($null -eq $selectedBaseline) { throw "no eligible published baseline exists for target $target" }
          $baseline = $selectedBaseline.tag
          $baselineState = $selectedBaseline.state
          $baselineSetupRollbackSupported = [bool]$selectedBaseline.setup_rollback_supported
          if ($env:LIFECYCLE_PACKAGE_SCOPE -ceq 'headless' -and -not $baselineSetupRollbackSupported) {
            throw 'Headless lifecycle requires a published baseline with real installer rollback support'
          }
          Write-Host "Lifecycle target=$target baseline=$baseline baseline_state=$baselineState setup_rollback_supported=$baselineSetupRollbackSupported"
          "TARGET_TAG=$target" | Out-File -FilePath $env:GITHUB_ENV -Append
          "TARGET_VERSION=$($target.Substring(4))" | Out-File -FilePath $env:GITHUB_ENV -Append
          "BASELINE_TAG=$baseline" | Out-File -FilePath $env:GITHUB_ENV -Append
          "BASELINE_VERSION=$($baseline.Substring(4))" | Out-File -FilePath $env:GITHUB_ENV -Append
          "BASELINE_SETUP_ROLLBACK_SUPPORTED=$($baselineSetupRollbackSupported.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Verify immutable asset download failure handling
        shell: pwsh
        run: ./tests/test_windows_immutable_download.ps1

      - name: Download immutable runtime and Setup EXE release packages
        shell: pwsh
        env:
          LIFECYCLE_PACKAGE_SCOPE: ${{ inputs.package_scope }}
        run: |
          New-Item -ItemType Directory -Force -Path downloads\target, downloads\baseline | Out-Null

          $script:immutableReleases = @{}
          function Get-ImmutableRelease([string]$Tag) {
            if ($script:immutableReleases.ContainsKey($Tag)) { return $script:immutableReleases[$Tag] }
            $releaseOutput = gh api `
              "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" 2>&1
            if ($LASTEXITCODE -ne 0) {
              throw "cannot list draft and published releases while resolving '$Tag': $($releaseOutput -join ' ')"
            }
            $releases = @($releaseOutput | ConvertFrom-Json)
            $releaseMatches = @($releases | Where-Object { $_.tag_name -eq $Tag })
            if ($releaseMatches.Count -ne 1) {
              $availableTags = @($releases | ForEach-Object { $_.tag_name }) -join ', '
              throw "release '$Tag' was not found in the authenticated draft/published release list; visible tags: $availableTags"
            }
            $release = $releaseMatches[0]
            $script:immutableReleases[$Tag] = $release
            return $release
          }

          function Get-ImmutableAsset([string]$Tag, [string]$Expected) {
            $release = Get-ImmutableRelease $Tag
            $matches = @($release.assets | Where-Object { $_.name -eq $expected })
            if ($matches.Count -ne 1) {
              $available = @($release.assets | ForEach-Object { $_.name }) -join ', '
              throw "release '$Tag' must contain exactly one '$expected'; available assets: $available"
            }
            return $matches[0]
          }

          function Download-ImmutableAsset([string]$Tag, [string]$Expected, [string]$Destination) {
            $asset = Get-ImmutableAsset $Tag $Expected
            $apiUrl = "$($asset.url)".Trim()
            if (-not $apiUrl) {
              throw "release asset '$($asset.name)' for '$Tag' has no API download URL"
            }
            $destinationPath = Join-Path $Destination $asset.name
            $partialPath = "$destinationPath.partial"
            $headers = @{
              Authorization = "Bearer $env:GH_TOKEN"
              Accept = 'application/octet-stream'
              'X-GitHub-Api-Version' = '2022-11-28'
            }
            try {
              for ($attempt = 1; $attempt -le 4; $attempt++) {
                if (Test-Path -LiteralPath $partialPath) {
                  Remove-Item -LiteralPath $partialPath -Force -ErrorAction Stop
                }
                try {
                  # Retry the same asset API URL, never a cached signed redirect.
                  # Default certificate validation and redirect credential stripping remain enabled.
                  Invoke-WebRequest -Uri $apiUrl -Headers $headers -OutFile $partialPath `
                    -ConnectionTimeoutSeconds 30 -OperationTimeoutSeconds 60 -ErrorAction Stop
                } catch {
                  $cause = $_.Exception
                  $reasons = @()
                  $statusCode = 0
                  $retryable = $false
                  while ($null -ne $cause) {
                    $reasons += "$($cause.GetType().Name) [HResult=$($cause.HResult)]: $($cause.Message)"
                    if ($cause -is [System.Net.Http.HttpRequestException] -or
                        $cause -is [System.Net.WebException] -or
                        $cause -is [System.IO.IOException] -or
                        $cause -is [System.TimeoutException] -or
                        $cause -is [System.Threading.Tasks.TaskCanceledException] -or
                        $cause -is [System.Security.Authentication.AuthenticationException]) {
                      $retryable = $true
                    }
                    if ($cause.PSObject.Properties['Response'] -and $null -ne $cause.Response) {
                      $statusCode = [int]$cause.Response.StatusCode
                    } elseif ($cause.PSObject.Properties['StatusCode'] -and $null -ne $cause.StatusCode) {
                      $statusCode = [int]$cause.StatusCode
                    }
                    $cause = $cause.InnerException
                  }
                  if ($statusCode) {
                    $retryable = $statusCode -in @(408, 429, 500, 502, 503, 504)
                  }
                  # Exception messages can contain signed URLs; do not expose them or the token.
                  $reason = $reasons -join ' -> '
                  if ($env:GH_TOKEN) { $reason = $reason.Replace($env:GH_TOKEN, '[redacted-token]') }
                  $reason = $reason -replace 'https?://[^\s''"<>]+', '[redacted-url]'
                  if (-not $retryable -or $attempt -eq 4) {
                    throw "failed to download immutable runtime '$($asset.name)' from release '$Tag' after $attempt attempt(s) (HTTP $statusCode): $reason"
                  }
                  $delay = [int][Math]::Pow(2, $attempt)
                  Write-Warning "Asset '$($asset.name)' attempt $attempt/4 failed (HTTP $statusCode); retry in ${delay}s: $reason"
                  Start-Sleep -Seconds $delay
                  continue
                }
                # Integrity failures are not transport retries and never publish a partial file.
                $downloaded = Get-Item -LiteralPath $partialPath -ErrorAction Stop
                if ($asset.size -and $downloaded.Length -ne [int64]$asset.size) {
                  throw "runtime '$($asset.name)' size mismatch: expected $($asset.size), got $($downloaded.Length)"
                }
                $digest = "$($asset.digest)".Trim()
                if ($digest -match '^sha256:(?<hash>[0-9a-fA-F]{64})$') {
                  $expectedHash = $Matches.hash
                  $actual = (Get-FileHash -LiteralPath $partialPath -Algorithm SHA256 -ErrorAction Stop).Hash
                  if ($actual -ine $expectedHash) {
                    throw "runtime '$($asset.name)' SHA-256 mismatch"
                  }
                }
                Move-Item -LiteralPath $partialPath -Destination $destinationPath -Force -ErrorAction Stop
                Write-Host "Verified release asset '$($asset.name)' from '$Tag' ($($downloaded.Length) bytes, attempt $attempt)"
                return
              }
            } finally {
              if (Test-Path -LiteralPath $partialPath) {
                Remove-Item -LiteralPath $partialPath -Force -ErrorAction Stop
              }
            }
          }

          $targetRuntime = "edr-agent-$env:TARGET_TAG-windows-${{ matrix.arch }}-exe.zip"
          $baselineRuntime = "edr-agent-$env:BASELINE_TAG-windows-${{ matrix.arch }}-exe.zip"
          Download-ImmutableAsset $env:TARGET_TAG $targetRuntime downloads\target
          Download-ImmutableAsset $env:BASELINE_TAG $baselineRuntime downloads\baseline

          if ($env:LIFECYCLE_PACKAGE_SCOPE -ceq 'full') {
            $targetSetup = "edr-agent-$env:TARGET_TAG-windows-${{ matrix.arch }}-setup.exe"
            $baselineSetup = "edr-agent-$env:BASELINE_TAG-windows-${{ matrix.arch }}-setup.exe"
            Download-ImmutableAsset $env:TARGET_TAG $targetSetup downloads\target
            Download-ImmutableAsset $env:BASELINE_TAG $baselineSetup downloads\baseline
            $targetZip = @(Get-ChildItem downloads\target -Filter *.zip -File)
            $baselineZip = @(Get-ChildItem downloads\baseline -Filter *.zip -File)
            if ($targetZip.Count -ne 1 -or $baselineZip.Count -ne 1) {
              throw 'expected exactly one target and baseline runtime ZIP'
            }
            Expand-Archive -LiteralPath $targetZip[0].FullName -DestinationPath packages\target -Force
            Expand-Archive -LiteralPath $baselineZip[0].FullName -DestinationPath packages\baseline -Force
          } elseif ($env:LIFECYCLE_PACKAGE_SCOPE -ceq 'headless') {
            # Only ZIP + artifact manifest enter each strict staging input directory.
            Download-ImmutableAsset $env:TARGET_TAG "edr-agent-$env:TARGET_TAG-windows-${{ matrix.arch }}-artifact-manifest.json" downloads\target
            Download-ImmutableAsset $env:BASELINE_TAG "edr-agent-$env:BASELINE_TAG-windows-${{ matrix.arch }}-artifact-manifest.json" downloads\baseline
            New-Item -ItemType Directory -Path release-metadata -ErrorAction Stop | Out-Null

            function Resolve-ReleaseTagCommit([string]$Tag, $Release) {
              # Exit 2 means an absent ref. Authentication/transport failures must fail closed.
              $refs = @(& git -c http.lowSpeedLimit=1 -c http.lowSpeedTime=30 ls-remote --exit-code origin "refs/tags/$Tag" "refs/tags/$Tag^{}" 2>$null)
              $status = $LASTEXITCODE
              if ($status -eq 2 -and $Release.draft -eq $true -and
                  "$($Release.target_commitish)" -cmatch '^[0-9a-f]{40}$') {
                return "$($Release.target_commitish)"
              }
              if ($status -ne 0) { throw "cannot resolve immutable source tag '$Tag' (git exit $status)" }
              $direct = @()
              $peeled = @()
              foreach ($line in $refs) {
                $fields = "$line" -split '\s+'
                if ($fields.Count -ne 2 -or $fields[0] -cnotmatch '^[0-9a-f]{40}$') {
                  throw "invalid git tag response for '$Tag'"
                }
                if ($fields[1] -ceq "refs/tags/$Tag") { $direct += $fields[0] }
                elseif ($fields[1] -ceq "refs/tags/$Tag^{}") { $peeled += $fields[0] }
                else { throw "unexpected git ref for '$Tag'" }
              }
              if ($direct.Count -ne 1 -or $peeled.Count -gt 1) { throw "ambiguous immutable source tag '$Tag'" }
              if ($peeled.Count -eq 1) { return $peeled[0] }
              return $direct[0]
            }

            $targetRelease = Get-ImmutableRelease $env:TARGET_TAG
            $baselineRelease = Get-ImmutableRelease $env:BASELINE_TAG
            $targetCommit = Resolve-ReleaseTagCommit $env:TARGET_TAG $targetRelease
            $baselineCommit = Resolve-ReleaseTagCommit $env:BASELINE_TAG $baselineRelease
            $utf8 = [Text.UTF8Encoding]::new($false)
            [IO.File]::WriteAllText((Join-Path $PWD 'release-metadata/target.json'), ($targetRelease | ConvertTo-Json -Depth 100), $utf8)
            [IO.File]::WriteAllText((Join-Path $PWD 'release-metadata/baseline.json'), ($baselineRelease | ConvertTo-Json -Depth 100), $utf8)
            $targetStageJson = & python .\scripts\windows_release_checkpoint.py stage-headless `
              --tag $env:TARGET_TAG --arch '${{ matrix.arch }}' `
              --directory downloads\target --destination packages\target `
              --release-metadata release-metadata\target.json --tag-commit $targetCommit `
              --expected-source-commit $env:GITHUB_SHA --expected-run-id $env:GITHUB_RUN_ID
            if ($LASTEXITCODE -ne 0) { throw 'target Headless package verification and staging failed' }
            $targetStage = $targetStageJson | ConvertFrom-Json -ErrorAction Stop
            $baselineStageJson = & python .\scripts\windows_release_checkpoint.py stage-headless `
              --tag $env:BASELINE_TAG --arch '${{ matrix.arch }}' `
              --directory downloads\baseline --destination packages\baseline `
              --release-metadata release-metadata\baseline.json --tag-commit $baselineCommit `
              --published-baseline --target-tag $env:TARGET_TAG
            if ($LASTEXITCODE -ne 0) { throw 'baseline Headless package verification and staging failed' }
            $baselineStage = $baselineStageJson | ConvertFrom-Json -ErrorAction Stop
            if (-not $targetStage.setup_exe -or -not $baselineStage.setup_exe) {
              throw 'verified embedded installer paths are required'
            }
            "TARGET_SETUP_EXE=$($targetStage.setup_exe)" | Out-File -FilePath $env:GITHUB_ENV -Append
            "BASELINE_SETUP_EXE=$($baselineStage.setup_exe)" | Out-File -FilePath $env:GITHUB_ENV -Append
            $targetStageJson | Set-Content -LiteralPath release-metadata\target-stage.json
            $baselineStageJson | Set-Content -LiteralPath release-metadata\baseline-stage.json
          } else {
            throw 'package_scope must be full or headless'
          }

      - name: Execute real Setup EXE install, upgrade, rollback, and uninstall
        shell: pwsh
        env:
          LIFECYCLE_PACKAGE_SCOPE: ${{ inputs.package_scope }}
        run: |
          if ($env:LIFECYCLE_PACKAGE_SCOPE -ceq 'headless') {
            $targetSetupPath = $env:TARGET_SETUP_EXE
            $baselineSetupPath = $env:BASELINE_SETUP_EXE
            if (-not $targetSetupPath -or -not $baselineSetupPath) {
              throw 'verified embedded installer paths are required'
            }
          } else {
            $targetSetup = @(Get-ChildItem downloads\target -Filter "*-setup.exe" -File)
            $baselineSetup = @(Get-ChildItem downloads\baseline -Filter "*-setup.exe" -File)
            if ($targetSetup.Count -ne 1 -or $baselineSetup.Count -ne 1) {
              throw "expected exactly one target and baseline Setup EXE"
            }
            $targetSetupPath = $targetSetup[0].FullName
            $baselineSetupPath = $baselineSetup[0].FullName
          }
          $lifecycleParams = @{
            BaselineSetupExe = $baselineSetupPath
            TargetSetupExe = $targetSetupPath
            BaselineVersion = $env:BASELINE_VERSION
            TargetVersion = $env:TARGET_VERSION
            Architecture = '${{ matrix.arch }}'
            EvidenceDir = 'setup-exe-evidence'
          }
          if ($env:BASELINE_SETUP_ROLLBACK_SUPPORTED -ne 'true') {
            $lifecycleParams.SkipSetupRollback = $true
          }
          & .\scripts\windows_setup_exe_lifecycle_smoke.ps1 @lifecycleParams

      - name: Execute native runtime update lifecycle
        shell: pwsh
        run: |
          [int]$repeatCount = $env:NATIVE_REPEAT_COUNT
          for ($round = 1; $round -le $repeatCount; $round++) {
            $evidenceDir = if ($round -eq 1) { 'runtime-evidence' } else { 'runtime-evidence\round-{0:D2}' -f $round }
            .\scripts\windows_release_lifecycle_smoke.ps1 `
              -BaselinePackageDir packages\baseline `
              -TargetPackageDir packages\target `
              -BaselineVersion $env:BASELINE_VERSION `
              -TargetVersion $env:TARGET_VERSION `
              -Architecture '${{ matrix.arch }}' `
              -EvidenceDir $evidenceDir
          }

      - name: Publish lifecycle evidence summary
        if: always()
        shell: pwsh
        run: |
          "## Windows ${{ matrix.arch }} Setup EXE lifecycle evidence" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "Evidence artifact: `windows-lifecycle-evidence-${{ matrix.arch }}` (setup-exe-evidence, runtime-evidence)." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          if (Test-Path -LiteralPath setup-exe-evidence\summary.json) {
            '```json' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            Get-Content -LiteralPath setup-exe-evidence\summary.json | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }
          "## Windows ${{ matrix.arch }} native runtime lifecycle evidence" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          if (Test-Path -LiteralPath runtime-evidence\summary.json) {
            '```json' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            Get-Content -LiteralPath runtime-evidence\summary.json |
              Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            if (Test-Path -LiteralPath runtime-evidence\uninstall-script-last.json) {
              "### Uninstall script diagnostic" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
              '```json' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
              Get-Content -LiteralPath runtime-evidence\uninstall-script-last.json |
                Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
              '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            }
            if (Test-Path -LiteralPath runtime-evidence\uninstall-powershell-last.log) {
              "### Native-captured uninstall PowerShell output" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
              '```text' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
              Get-Content -LiteralPath runtime-evidence\uninstall-powershell-last.log |
                Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
              '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            }
            if (Test-Path -LiteralPath runtime-evidence\uninstall-cleanup-last.json) {
              "### Deferred uninstall cleanup receipt" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
              '```json' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
              Get-Content -LiteralPath runtime-evidence\uninstall-cleanup-last.json |
                Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
              '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            }
            if (Test-Path -LiteralPath runtime-evidence\uninstall-cleanup-last.stderr.log) {
              "### Deferred uninstall cleanup stderr" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
              '```text' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
              Get-Content -LiteralPath runtime-evidence\uninstall-cleanup-last.stderr.log |
                Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
              '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            }
            if (Test-Path -LiteralPath runtime-evidence\uninstall-attestation-listener-job.json) {
              "### Uninstall attestation listener" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
              '```json' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
              Get-Content -LiteralPath runtime-evidence\uninstall-attestation-listener-job.json |
                Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
              '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            }
            if (Test-Path -LiteralPath runtime-evidence\uninstall-attestation-attempts.json) {
              "### Uninstall attestation attempts" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
              '```json' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
              Get-Content -LiteralPath runtime-evidence\uninstall-attestation-attempts.json |
                Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
              '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            }
          } else {
            "Lifecycle did not reach a passing summary. Inspect the failed step and service diagnostics in this job log." |
              Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }
          foreach ($diagnostic in @(
              'uninstall-finalizers-this-run.json',
              'uninstall-finalizer-state.json',
              'native-failure-receipt.txt',
              'native-failure-receipt-tmp.txt',
              'uninstall-install-root-residual.json',
              'uninstall-install-processes.json',
              'uninstall-service.txt',
              'uninstall-tasks.txt',
              'uninstall-diagnostics-errors.json'
            )) {
            $diagnosticPath = Join-Path 'runtime-evidence' $diagnostic
            if (Test-Path -LiteralPath $diagnosticPath) {
              "### Uninstall diagnostic: $diagnostic" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
              '```text' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
              Get-Content -LiteralPath $diagnosticPath -TotalCount 120 | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
              '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            }
          }
          [int]$expectedRounds = 0
          try { $expectedRounds = [int]$env:NATIVE_REPEAT_COUNT } catch {
            "Unable to parse expected native round count: $($_.Exception.Message)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }
          $roundDirectories = @()
          try {
            if (Test-Path -LiteralPath runtime-evidence) {
              $roundDirectories = @(Get-ChildItem -LiteralPath runtime-evidence -Directory -Filter 'round-*' -ErrorAction Stop | Sort-Object Name)
            }
          } catch {
            "Unable to enumerate native lifecycle round evidence: $($_.Exception.Message)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }
          $actualSummaryCount = if (Test-Path -LiteralPath runtime-evidence\summary.json) { 1 } else { 0 }
          foreach ($roundDirectory in $roundDirectories) {
            $roundSummary = Join-Path $roundDirectory.FullName 'summary.json'
            if (Test-Path -LiteralPath $roundSummary) { $actualSummaryCount++ }
          }
          "Native runtime rounds: expected=$expectedRounds actual_summaries=$actualSummaryCount" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          foreach ($roundDirectory in $roundDirectories) {
            "## Native runtime lifecycle $($roundDirectory.Name)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            try {
              $roundSummary = Join-Path $roundDirectory.FullName 'summary.json'
              if (Test-Path -LiteralPath $roundSummary) {
                '```json' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
                Get-Content -LiteralPath $roundSummary -ErrorAction Stop | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
                '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
              } else {
                'No summary.json was produced for this round.' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
              }
              foreach ($diagnostic in @(
                  'uninstall-finalizers-this-run.json',
                  'uninstall-finalizer-state.json',
                  'native-failure-receipt.txt',
                  'native-failure-receipt-tmp.txt',
                  'uninstall-install-root-residual.json',
                  'uninstall-install-processes.json',
                  'uninstall-service.txt',
                  'uninstall-tasks.txt',
                  'uninstall-diagnostics-errors.json'
                )) {
                $diagnosticPath = Join-Path $roundDirectory.FullName $diagnostic
                if (Test-Path -LiteralPath $diagnosticPath) {
                  "### $($roundDirectory.Name) diagnostic: $diagnostic" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
                  '```text' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
                  Get-Content -LiteralPath $diagnosticPath -TotalCount 120 -ErrorAction Stop | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
                  '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
                }
              }
            } catch {
              "Unable to collect $($roundDirectory.Name) evidence: $($_.Exception.Message)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            }
          }

      - name: Upload Windows lifecycle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-lifecycle-evidence-${{ matrix.arch }}
          path: |
            setup-exe-evidence
            runtime-evidence
            release-metadata
          if-no-files-found: warn
          retention-days: 7

  recover-synthetic-owner:
    if: github.event_name == 'workflow_dispatch' && inputs.cache_recovery_subset == true && github.repository == 'qiuxinliang/edr-agent'
    permissions:
      contents: read
      actions: read
    runs-on: windows-11-arm
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Validate fixed manual cache recovery cohort
        env:
          RECOVERY_TARGET_TAG: ${{ inputs.target_tag }}
          RECOVERY_BASELINE_TAG: ${{ inputs.baseline_tag }}
          RECOVERY_PACKAGE_SCOPE: ${{ inputs.package_scope }}
          RECOVERY_ARCHITECTURE: ${{ inputs.architecture }}
        run: |
          if ($env:RECOVERY_TARGET_TAG -cne 'win_3.2.695' -or $env:RECOVERY_BASELINE_TAG -cne 'win_3.2.692' -or $env:RECOVERY_PACKAGE_SCOPE -cne 'headless' -or $env:RECOVERY_ARCHITECTURE -cne 'arm64') { throw 'Manual cache recovery requires exact 695/692 Headless ARM64 cohort' }
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          submodules: false
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: qiuxinliang/edr-agent
          ref: 694a4f47cfd55a7c98f8dab62617520c0c6251b1
          path: canonical-agent
          persist-credentials: false
      - name: Verify exact source, syntax, and pure helper contracts
        env:
          EDR_RECOVERY_NATIVE_STAGE_OWNER: ${{ github.workspace }}/canonical-agent/scripts/stage_retention_native_tools.py
        run: |
          $sha = (git -C canonical-agent rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $sha -cne '694a4f47cfd55a7c98f8dab62617520c0c6251b1') { throw 'Pinned Agent checkout mismatch' }
          git -C canonical-agent diff --exit-code
          if ($LASTEXITCODE -ne 0) { throw 'Agent source changed' }
          $errors=$null;$tokens=$null
          [Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'tests/cache-recovery/windows_cache_recovery_ci.ps1'),[ref]$tokens,[ref]$errors) | Out-Null
          if (@($errors).Count) { throw 'Recovery driver PowerShell parse failed' }
          $driver=Join-Path $PWD 'tests/cache-recovery/windows_cache_recovery_ci.ps1'
          $driverSha=(Get-FileHash -LiteralPath $driver -Algorithm SHA256).Hash.ToLowerInvariant()
          & (Join-Path $PWD 'tests/cache-recovery/test_recovery_driver_contracts.ps1') -DriverSource $driver -DriverSha256 $driverSha
          if (-not $?) { throw 'Pure driver function contracts failed' }
          python -I -B tests/cache-recovery/test_cache_recovery_snapshot.py
          if ($LASTEXITCODE -ne 0) { throw 'Read-only synthetic snapshot/native-manifest checks failed' }
          python -I -B tests/cache-recovery/test_prepare_disposable_695.py
          if ($LASTEXITCODE -ne 0) { throw 'Preparation negative contracts failed' }
          python -I -B tests/cache-recovery/test_collect_recovery_artifacts.py
          if ($LASTEXITCODE -ne 0) { throw 'Private QA collector bounds/identity contracts failed' }
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.0'
          cache: false
      - name: Bind original-handler verification and prepare exact published inputs
        timeout-minutes: 20
        env:
          # Same-repository read token only. A missing scope/403 is terminal;
          # no PAT, cross-repository token, fallback or permission expansion.
          GH_TOKEN: ${{ github.token }}
          P5_BACKEND_OWNER_BASE64: ${{ inputs.backend_builder_base64 }}
          P5_HANDLER_VERIFICATION_JSON: ${{ inputs.handler_verification_json }}
          P5_HANDLER_VERIFICATION_SHA256: ${{ inputs.handler_verification_sha256 }}
          P5_HIGHER_MIN_FREE_BYTES: ${{ inputs.higher_min_free_bytes }}
        run: |
          $root = Join-Path $env:RUNNER_TEMP ('edr-private-p5-recovery-'+[guid]::NewGuid().ToString('N'))
          "EDR_PRIVATE_RECOVERY_PREP=$root" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "EDR_PRIVATE_RECOVERY_METADATA=$(Join-Path $env:RUNNER_TEMP ('uncreated-recovery-metadata-'+[guid]::NewGuid().ToString('N')))" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          python -I -B tests/cache-recovery/prepare_disposable_695.py prepare --workspace "$PWD" --output "$root"
          if ($LASTEXITCODE -ne 0) { throw 'Preparation failed; no fallback, retry, scope change or recovery launch' }
      - name: Run original stdlib builder by file-list overlay and require original-handler P5 SHA
        timeout-minutes: 3
        env:
          GOPROXY: 'off'
          GOSUMDB: 'off'
          GOTOOLCHAIN: local
          GO111MODULE: 'off'
          GOWORK: 'off'
          CGO_ENABLED: '0'
        run: |
          $env:EDR_P5_EXPORT_OWNER=Join-Path $env:EDR_PRIVATE_RECOVERY_PREP 'source-owner/full_installer.go'
          $virtual=Join-Path (Split-Path $env:EDR_P5_EXPORT_OWNER -Parent) 'zz_private_695_p5_export_test.go'
          $env:EDR_P5_EXPORT_BINDING=Join-Path $env:EDR_PRIVATE_RECOVERY_PREP 'p5-binding.json'
          $env:EDR_P5_EXPORT_BINDING_SHA256=(Get-FileHash $env:EDR_P5_EXPORT_BINDING -Algorithm SHA256).Hash.ToLowerInvariant()
          go test -overlay (Join-Path $env:EDR_PRIVATE_RECOVERY_PREP 'overlay.json') $env:EDR_P5_EXPORT_OWNER $virtual -run '^TestPrivateP5Export695$' -count=1 -timeout=30s -v
          if ($LASTEXITCODE -ne 0) { throw 'Original builder/preflight SHA gate failed; no recovery launch' }
          python -I -B tests/cache-recovery/prepare_disposable_695.py finalize --workspace "$PWD" --output "$env:EDR_PRIVATE_RECOVERY_PREP"
          if ($LASTEXITCODE -ne 0) { throw 'Original builder output binding failed' }
      - name: Verify process-scoped Windows PowerShell child module environment
        shell: pwsh
        timeout-minutes: 2
        run: |
          $driver=Join-Path $PWD 'tests/cache-recovery/windows_cache_recovery_ci.ps1'
          $driverSha=(Get-FileHash -LiteralPath $driver -Algorithm SHA256).Hash.ToLowerInvariant()
          & (Join-Path $PWD 'tests/cache-recovery/test_windows_powershell_child_environment.ps1') -DriverSource $driver -DriverSha256 $driverSha
          if ($LASTEXITCODE -ne 0) { throw 'Process-scoped Windows PowerShell child module environment contract failed' }
      - name: Execute only disposable local rollback and normal repair subset
        shell: pwsh
        run: |
          $binding=Join-Path $env:EDR_PRIVATE_RECOVERY_PREP 'recovery-input.json'
          $sha=(Get-FileHash $binding -Algorithm SHA256).Hash.ToLowerInvariant()
          $before=@(Get-ChildItem -LiteralPath $env:RUNNER_TEMP -Directory -Filter 'edr-cache-recovery-*' | ForEach-Object FullName)
          try {
            & (Join-Path $PWD 'tests/cache-recovery/windows_cache_recovery_ci.ps1') -InputJson $binding -InputSha256 $sha
            if ($LASTEXITCODE -ne 0) { throw 'Disposable recovery subset failed or unknown' }
          } finally {
            $fresh=@(Get-ChildItem -LiteralPath $env:RUNNER_TEMP -Directory -Filter 'edr-cache-recovery-*' | Where-Object {$_.FullName -notin $before})
            if ($fresh.Count -eq 1 -and ($fresh[0].Attributes -band [IO.FileAttributes]::ReparsePoint) -eq 0) {
              $summary=Join-Path $fresh[0].FullName 'recovery-subset-summary.json'
              if (Test-Path -LiteralPath $summary -PathType Leaf) {
                $meta=Get-Content -Raw -LiteralPath $summary | ConvertFrom-Json -ErrorAction Stop
                if ($meta.input_sha256 -cne $sha) { throw 'Recovery metadata owner binding mismatch' }
                "EDR_PRIVATE_RECOVERY_METADATA=$($fresh[0].FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
              }
            }
          }
      - name: Freeze fixed synthetic transition raw evidence and hashes
        id: collect-cache-qa
        if: always()
        timeout-minutes: 2
        run: |
          if ($env:EDR_PRIVATE_RECOVERY_PREP -and $env:EDR_PRIVATE_RECOVERY_METADATA) {
            $binding=Join-Path $env:EDR_PRIVATE_RECOVERY_PREP 'recovery-input.json'
            if ((Test-Path -LiteralPath $binding -PathType Leaf) -and (Test-Path -LiteralPath $env:EDR_PRIVATE_RECOVERY_METADATA -PathType Container)) {
              $sha=(Get-FileHash -LiteralPath $binding -Algorithm SHA256).Hash.ToLowerInvariant()
              $qa=Join-Path $env:RUNNER_TEMP ('edr-cache-recovery-qa-'+[guid]::NewGuid().ToString('N'))
              python -I -B tests/cache-recovery/collect_recovery_artifacts.py --source "$env:EDR_PRIVATE_RECOVERY_METADATA" --binding "$binding" --binding-sha256 "$sha" --output "$qa"
              if ($LASTEXITCODE -ne 0) { throw 'Private CI fixture raw evidence collection failed; no unverified files uploaded' }
              "directory=$qa" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
              'available=true' | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
            } else {
              'available=false' | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
              Write-Output 'No bound recovery fixture observed; no source directory exported'
            }
          } else {
            'available=false' | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Output 'Preparation did not establish a bound recovery fixture; no source directory exported'
          }
      - name: Retain bounded synthetic transition raw evidence, never Agent data
        if: always() && steps.collect-cache-qa.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: disposable-cache-recovery-695-metadata-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: error
          path: ${{ steps.collect-cache-qa.outputs.directory }}
# Manual subset does not register/promote packages, upload Release assets, use
# platform API auth, migrate real data, or claim the immutable 695 clock fixed.
