name: Windows install upgrade rollback

on:
  workflow_call:
    inputs:
      target_tag:
        description: Target release tag
        required: true
        type: string
      baseline_tag:
        description: Previously verified release; empty selects the newest older release
        required: false
        default: ''
        type: string
  workflow_dispatch:
    inputs:
      target_tag:
        description: Target release tag
        required: true
        type: string
      baseline_tag:
        description: Previously verified release; empty selects the newest older release
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: windows-lifecycle-${{ inputs.target_tag }}
  cancel-in-progress: false

jobs:
  amd64-lifecycle:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6

      - name: Resolve release tags
        shell: pwsh
        run: |
          $target = '${{ inputs.target_tag }}'.Trim()
          $baseline = '${{ inputs.baseline_tag }}'.Trim()
          if ($target -notmatch '^win_\d+\.\d+\.\d+$') {
            throw "invalid target release tag: $target"
          }
          if (-not $baseline) {
            $targetVersion = [Version]$target.Substring(4)
            $releaseJson = gh release list --repo $env:GITHUB_REPOSITORY --limit 100 `
              --json tagName,isDraft,isPrerelease
            if ($LASTEXITCODE -ne 0) { throw 'cannot list published releases for baseline selection' }
            $candidates = @()
            foreach ($release in @($releaseJson | ConvertFrom-Json)) {
              if ($release.isDraft -or $release.isPrerelease -or $release.tagName -notmatch '^win_\d+\.\d+\.\d+$') { continue }
              $version = [Version]$release.tagName.Substring(4)
              if ($version -lt $targetVersion) {
                $candidates += [pscustomobject]@{ Tag = $release.tagName; Version = $version }
              }
            }
            $baseline = ($candidates | Sort-Object Version -Descending | Select-Object -First 1).Tag
          }
          if ($baseline -notmatch '^win_\d+\.\d+\.\d+$') { throw "no valid older release exists for target $target" }
          if ($target -eq $baseline) { throw 'target and baseline releases must differ' }
          Write-Host "Lifecycle target=$target baseline=$baseline"
          "TARGET_TAG=$target" | Out-File -FilePath $env:GITHUB_ENV -Append
          "TARGET_VERSION=$($target.Substring(4))" | Out-File -FilePath $env:GITHUB_ENV -Append
          "BASELINE_TAG=$baseline" | Out-File -FilePath $env:GITHUB_ENV -Append
          "BASELINE_VERSION=$($baseline.Substring(4))" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Download immutable AMD64 release packages
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path downloads\target, downloads\baseline | Out-Null
          gh release download $env:TARGET_TAG --repo $env:GITHUB_REPOSITORY `
            --pattern "*windows-amd64-exe.zip" --dir downloads\target
          gh release download $env:BASELINE_TAG --repo $env:GITHUB_REPOSITORY `
            --pattern "*windows-amd64-exe.zip" --dir downloads\baseline
          $targetZip = @(Get-ChildItem downloads\target -Filter *.zip -File)
          $baselineZip = @(Get-ChildItem downloads\baseline -Filter *.zip -File)
          if ($targetZip.Count -ne 1 -or $baselineZip.Count -ne 1) {
            throw "expected one immutable runtime ZIP for each release"
          }
          Expand-Archive -LiteralPath $targetZip[0].FullName -DestinationPath packages\target -Force
          Expand-Archive -LiteralPath $baselineZip[0].FullName -DestinationPath packages\baseline -Force

      - name: Install, upgrade, rollback, and uninstall
        shell: pwsh
        run: |
          .\scripts\windows_release_lifecycle_smoke.ps1 `
            -BaselinePackageDir packages\baseline `
            -TargetPackageDir packages\target `
            -BaselineVersion $env:BASELINE_VERSION `
            -TargetVersion $env:TARGET_VERSION `
            -EvidenceDir evidence

      - name: Publish lifecycle evidence summary
        if: always()
        shell: pwsh
        run: |
          "## Windows AMD64 lifecycle evidence" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          if (Test-Path -LiteralPath evidence\summary.json) {
            '```json' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            Get-Content -LiteralPath evidence\summary.json |
              Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          } else {
            "Lifecycle did not reach a passing summary. Inspect the failed step and service diagnostics in this job log." |
              Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }
