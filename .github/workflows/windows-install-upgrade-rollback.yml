name: Windows install upgrade rollback

on:
  workflow_call:
    inputs:
      target_tag:
        description: Target release tag
        required: true
        type: string
      baseline_tag:
        description: Published baseline; empty selects the newest older published release with complete assets for both architectures
        required: false
        default: ''
        type: string
      architecture:
        description: Native architecture to validate (all, amd64, or arm64)
        required: false
        default: all
        type: string
      native_repeat_count:
        description: Serial native runtime lifecycle rounds (1..5)
        required: false
        default: 1
        type: number
      evidence_transport:
        description: Evidence storage (actions or private release)
        required: false
        default: actions
        type: string
    secrets:
      USB_SIGNING_RELEASE_TOKEN:
        description: Contents write restricted to the private signing repository; used only by release evidence transport
        required: false
  workflow_dispatch:
    inputs:
      target_tag:
        description: Target release tag
        required: true
        type: string
      baseline_tag:
        description: Published baseline; empty selects the newest older published release with complete assets for both architectures
        required: false
        default: ''
        type: string
      architecture:
        description: Native architecture to validate (all, amd64, or arm64)
        required: false
        default: all
        type: choice
        options:
          - all
          - amd64
          - arm64
      native_repeat_count:
        description: Serial native runtime lifecycle rounds (1..5)
        required: false
        default: 1
        type: number
      evidence_transport:
        description: Evidence storage
        required: false
        default: actions
        type: choice
        options:
          - actions
          - release

permissions:
  # GitHub hides draft releases from tokens without push-level contents access.
  # This job never mutates a release, but it must read the target draft assets
  # before the publish gate can complete.
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: windows-lifecycle-${{ inputs.target_tag }}
  cancel-in-progress: false

jobs:
  native-lifecycle:
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.architecture == 'all' && '[{"arch":"amd64","runner":"windows-2022"},{"arch":"arm64","runner":"windows-11-arm"}]' || inputs.architecture == 'amd64' && '[{"arch":"amd64","runner":"windows-2022"}]' || inputs.architecture == 'arm64' && '[{"arch":"arm64","runner":"windows-11-arm"}]' || '[{"arch":"invalid","runner":"windows-2022"}]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6

      - name: Validate lifecycle inputs
        shell: pwsh
        env:
          LIFECYCLE_ARCHITECTURE: ${{ inputs.architecture }}
          LIFECYCLE_REPEAT_COUNT: ${{ inputs.native_repeat_count }}
          LIFECYCLE_MATRIX_ARCH: ${{ matrix.arch }}
          LIFECYCLE_EVIDENCE_TRANSPORT: ${{ inputs.evidence_transport }}
          PRIVATE_EVIDENCE_TOKEN: ${{ secrets.USB_SIGNING_RELEASE_TOKEN }}
        run: |
          $architecture = $env:LIFECYCLE_ARCHITECTURE
          if ($architecture -cnotin @('all', 'amd64', 'arm64')) {
            throw "invalid architecture input: $architecture"
          }
          if ($env:LIFECYCLE_MATRIX_ARCH -eq 'invalid') {
            throw "invalid lifecycle matrix architecture for input: $architecture"
          }
          if ($env:LIFECYCLE_EVIDENCE_TRANSPORT -cnotin @('actions', 'release')) {
            throw 'evidence_transport must be actions or release'
          }
          if ($env:LIFECYCLE_EVIDENCE_TRANSPORT -eq 'release' -and -not $env:PRIVATE_EVIDENCE_TOKEN) {
            throw 'Private Release evidence requires USB_SIGNING_RELEASE_TOKEN with Contents write on the private signing repository'
          }
          [int]$repeatCount = 0
          $repeatText = $env:LIFECYCLE_REPEAT_COUNT
          if (-not [int]::TryParse($repeatText, [ref]$repeatCount) -or $repeatCount -lt 1 -or $repeatCount -gt 5) {
            throw "native_repeat_count must be an integer in 1..5; got '$repeatText'"
          }
          "NATIVE_REPEAT_COUNT=$repeatCount" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Restore pinned ARM64-host Python tool cache
        if: matrix.arch == 'arm64'
        uses: actions/cache/restore@v5
        with:
          path: |
            ${{ runner.tool_cache }}/Python/3.12.10/x64
            ${{ runner.tool_cache }}/Python/3.12.10/x64.complete
          key: python-tool-${{ runner.os }}-${{ runner.arch }}-3.12.10-x64-v1
      - name: Set up pinned Python for baseline selection
        uses: actions/setup-python@v6
        with:
          python-version: '3.12.10'
          architecture: x64

      - name: Resolve release tags
        shell: pwsh
        run: |
          $target = '${{ inputs.target_tag }}'.Trim()
          $requestedBaseline = '${{ inputs.baseline_tag }}'.Trim()
          $selectionArgs = @('select-baseline', '--target-tag', $target)
          if ($requestedBaseline) { $selectionArgs += @('--baseline-tag', $requestedBaseline) }
          $selectionJson = & python .\scripts\windows_release_checkpoint.py @selectionArgs
          if ($LASTEXITCODE -ne 0) { throw 'published Windows baseline selection failed' }
          $selectedBaseline = $selectionJson | ConvertFrom-Json -ErrorAction Stop
          if ($null -eq $selectedBaseline) { throw "no eligible published baseline exists for target $target" }
          $baseline = $selectedBaseline.tag
          $baselineState = $selectedBaseline.state
          $baselineSetupRollbackSupported = [bool]$selectedBaseline.setup_rollback_supported
          Write-Host "Lifecycle target=$target baseline=$baseline baseline_state=$baselineState setup_rollback_supported=$baselineSetupRollbackSupported"
          "TARGET_TAG=$target" | Out-File -FilePath $env:GITHUB_ENV -Append
          "TARGET_VERSION=$($target.Substring(4))" | Out-File -FilePath $env:GITHUB_ENV -Append
          "BASELINE_TAG=$baseline" | Out-File -FilePath $env:GITHUB_ENV -Append
          "BASELINE_VERSION=$($baseline.Substring(4))" | Out-File -FilePath $env:GITHUB_ENV -Append
          "BASELINE_SETUP_ROLLBACK_SUPPORTED=$($baselineSetupRollbackSupported.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Verify immutable asset download failure handling
        shell: pwsh
        run: ./tests/test_windows_immutable_download.ps1

      - name: Download immutable runtime and Setup EXE release packages
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path downloads\target, downloads\baseline | Out-Null

          function Get-ImmutableAsset([string]$Tag, [string]$Expected) {
            $releaseOutput = gh api `
              "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" 2>&1
            if ($LASTEXITCODE -ne 0) {
              throw "cannot list draft and published releases while resolving '$Tag': $($releaseOutput -join ' ')"
            }
            $releases = @($releaseOutput | ConvertFrom-Json)
            $releaseMatches = @($releases | Where-Object { $_.tag_name -eq $Tag })
            if ($releaseMatches.Count -ne 1) {
              $availableTags = @($releases | ForEach-Object { $_.tag_name }) -join ', '
              throw "release '$Tag' was not found in the authenticated draft/published release list; visible tags: $availableTags"
            }
            $release = $releaseMatches[0]
            $matches = @($release.assets | Where-Object { $_.name -eq $expected })
            if ($matches.Count -ne 1) {
              $available = @($release.assets | ForEach-Object { $_.name }) -join ', '
              throw "release '$Tag' must contain exactly one '$expected'; available assets: $available"
            }
            return $matches[0]
          }

          function Download-ImmutableAsset([string]$Tag, [string]$Expected, [string]$Destination) {
            $asset = Get-ImmutableAsset $Tag $Expected
            $apiUrl = "$($asset.url)".Trim()
            if (-not $apiUrl) {
              throw "release asset '$($asset.name)' for '$Tag' has no API download URL"
            }
            $destinationPath = Join-Path $Destination $asset.name
            $partialPath = "$destinationPath.partial"
            $headers = @{
              Authorization = "Bearer $env:GH_TOKEN"
              Accept = 'application/octet-stream'
              'X-GitHub-Api-Version' = '2022-11-28'
            }
            try {
              for ($attempt = 1; $attempt -le 4; $attempt++) {
                if (Test-Path -LiteralPath $partialPath) {
                  Remove-Item -LiteralPath $partialPath -Force -ErrorAction Stop
                }
                try {
                  # Retry the same asset API URL, never a cached signed redirect.
                  # Default certificate validation and redirect credential stripping remain enabled.
                  Invoke-WebRequest -Uri $apiUrl -Headers $headers -OutFile $partialPath `
                    -ConnectionTimeoutSeconds 30 -OperationTimeoutSeconds 60 -ErrorAction Stop
                } catch {
                  $cause = $_.Exception
                  $reasons = @()
                  $statusCode = 0
                  $retryable = $false
                  while ($null -ne $cause) {
                    $reasons += "$($cause.GetType().Name) [HResult=$($cause.HResult)]: $($cause.Message)"
                    if ($cause -is [System.Net.Http.HttpRequestException] -or
                        $cause -is [System.Net.WebException] -or
                        $cause -is [System.IO.IOException] -or
                        $cause -is [System.TimeoutException] -or
                        $cause -is [System.Threading.Tasks.TaskCanceledException] -or
                        $cause -is [System.Security.Authentication.AuthenticationException]) {
                      $retryable = $true
                    }
                    if ($cause.PSObject.Properties['Response'] -and $null -ne $cause.Response) {
                      $statusCode = [int]$cause.Response.StatusCode
                    } elseif ($cause.PSObject.Properties['StatusCode'] -and $null -ne $cause.StatusCode) {
                      $statusCode = [int]$cause.StatusCode
                    }
                    $cause = $cause.InnerException
                  }
                  if ($statusCode) {
                    $retryable = $statusCode -in @(408, 429, 500, 502, 503, 504)
                  }
                  # Exception messages can contain signed URLs; do not expose them or the token.
                  $reason = $reasons -join ' -> '
                  if ($env:GH_TOKEN) { $reason = $reason.Replace($env:GH_TOKEN, '[redacted-token]') }
                  $reason = $reason -replace 'https?://[^\s''"<>]+', '[redacted-url]'
                  if (-not $retryable -or $attempt -eq 4) {
                    throw "failed to download immutable runtime '$($asset.name)' from release '$Tag' after $attempt attempt(s) (HTTP $statusCode): $reason"
                  }
                  $delay = [int][Math]::Pow(2, $attempt)
                  Write-Warning "Asset '$($asset.name)' attempt $attempt/4 failed (HTTP $statusCode); retry in ${delay}s: $reason"
                  Start-Sleep -Seconds $delay
                  continue
                }
                # Integrity failures are not transport retries and never publish a partial file.
                $downloaded = Get-Item -LiteralPath $partialPath -ErrorAction Stop
                if ($asset.size -and $downloaded.Length -ne [int64]$asset.size) {
                  throw "runtime '$($asset.name)' size mismatch: expected $($asset.size), got $($downloaded.Length)"
                }
                $digest = "$($asset.digest)".Trim()
                if ($digest -match '^sha256:(?<hash>[0-9a-fA-F]{64})$') {
                  $expectedHash = $Matches.hash
                  $actual = (Get-FileHash -LiteralPath $partialPath -Algorithm SHA256 -ErrorAction Stop).Hash
                  if ($actual -ine $expectedHash) {
                    throw "runtime '$($asset.name)' SHA-256 mismatch"
                  }
                }
                Move-Item -LiteralPath $partialPath -Destination $destinationPath -Force -ErrorAction Stop
                Write-Host "Verified release asset '$($asset.name)' from '$Tag' ($($downloaded.Length) bytes, attempt $attempt)"
                return
              }
            } finally {
              if (Test-Path -LiteralPath $partialPath) {
                Remove-Item -LiteralPath $partialPath -Force -ErrorAction Stop
              }
            }
          }

          $targetRuntime = "edr-agent-$env:TARGET_TAG-windows-${{ matrix.arch }}-exe.zip"
          $baselineRuntime = "edr-agent-$env:BASELINE_TAG-windows-${{ matrix.arch }}-exe.zip"
          $targetSetup = "edr-agent-$env:TARGET_TAG-windows-${{ matrix.arch }}-setup.exe"
          $baselineSetup = "edr-agent-$env:BASELINE_TAG-windows-${{ matrix.arch }}-setup.exe"
          Download-ImmutableAsset $env:TARGET_TAG $targetRuntime downloads\target
          Download-ImmutableAsset $env:BASELINE_TAG $baselineRuntime downloads\baseline
          Download-ImmutableAsset $env:TARGET_TAG $targetSetup downloads\target
          Download-ImmutableAsset $env:BASELINE_TAG $baselineSetup downloads\baseline

          $targetZip = @(Get-ChildItem downloads\target -Filter *.zip -File)
          $baselineZip = @(Get-ChildItem downloads\baseline -Filter *.zip -File)
          if ($targetZip.Count -ne 1) {
            throw "target '$env:TARGET_TAG' resolved to $($targetZip.Count) runtime ZIP files; expected exactly one"
          }
          if ($baselineZip.Count -ne 1) {
            throw "baseline '$env:BASELINE_TAG' resolved to $($baselineZip.Count) runtime ZIP files; expected exactly one"
          }
          Expand-Archive -LiteralPath $targetZip[0].FullName -DestinationPath packages\target -Force
          Expand-Archive -LiteralPath $baselineZip[0].FullName -DestinationPath packages\baseline -Force

      - name: Execute real Setup EXE install, upgrade, rollback, and uninstall
        shell: pwsh
        run: |
          $targetSetup = @(Get-ChildItem downloads\target -Filter "*-setup.exe" -File)
          $baselineSetup = @(Get-ChildItem downloads\baseline -Filter "*-setup.exe" -File)
          if ($targetSetup.Count -ne 1 -or $baselineSetup.Count -ne 1) {
            throw "expected exactly one target and baseline Setup EXE"
          }
          $lifecycleParams = @{
            BaselineSetupExe = $baselineSetup[0].FullName
            TargetSetupExe = $targetSetup[0].FullName
            BaselineVersion = $env:BASELINE_VERSION
            TargetVersion = $env:TARGET_VERSION
            Architecture = '${{ matrix.arch }}'
            EvidenceDir = 'setup-exe-evidence'
          }
          if ($env:BASELINE_SETUP_ROLLBACK_SUPPORTED -ne 'true') {
            $lifecycleParams.SkipSetupRollback = $true
          }
          & .\scripts\windows_setup_exe_lifecycle_smoke.ps1 @lifecycleParams

      - name: Execute native runtime update lifecycle
        shell: pwsh
        run: |
          [int]$repeatCount = $env:NATIVE_REPEAT_COUNT
          for ($round = 1; $round -le $repeatCount; $round++) {
            $evidenceDir = if ($round -eq 1) { 'runtime-evidence' } else { 'runtime-evidence\round-{0:D2}' -f $round }
            .\scripts\windows_release_lifecycle_smoke.ps1 `
              -BaselinePackageDir packages\baseline `
              -TargetPackageDir packages\target `
              -BaselineVersion $env:BASELINE_VERSION `
              -TargetVersion $env:TARGET_VERSION `
              -Architecture '${{ matrix.arch }}' `
              -EvidenceDir $evidenceDir
          }

      - name: Publish lifecycle evidence summary
        if: always()
        shell: pwsh
        env:
          LIFECYCLE_EVIDENCE_TRANSPORT: ${{ inputs.evidence_transport }}
        run: |
          "## Windows ${{ matrix.arch }} Setup EXE lifecycle evidence" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          if ($env:LIFECYCLE_EVIDENCE_TRANSPORT -eq 'release') {
            "Private evidence draft: edr-evidence-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT-${{ matrix.arch }} (setup-exe-evidence, runtime-evidence)." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          } else {
            "Evidence artifact: `windows-lifecycle-evidence-${{ matrix.arch }}` (setup-exe-evidence, runtime-evidence)." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }
          if (Test-Path -LiteralPath setup-exe-evidence\summary.json) {
            '```json' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            Get-Content -LiteralPath setup-exe-evidence\summary.json | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }
          "## Windows ${{ matrix.arch }} native runtime lifecycle evidence" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          if (Test-Path -LiteralPath runtime-evidence\summary.json) {
            '```json' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            Get-Content -LiteralPath runtime-evidence\summary.json |
              Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            if (Test-Path -LiteralPath runtime-evidence\uninstall-script-last.json) {
              "### Uninstall script diagnostic" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
              '```json' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
              Get-Content -LiteralPath runtime-evidence\uninstall-script-last.json |
                Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
              '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            }
            if (Test-Path -LiteralPath runtime-evidence\uninstall-powershell-last.log) {
              "### Native-captured uninstall PowerShell output" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
              '```text' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
              Get-Content -LiteralPath runtime-evidence\uninstall-powershell-last.log |
                Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
              '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            }
            if (Test-Path -LiteralPath runtime-evidence\uninstall-cleanup-last.json) {
              "### Deferred uninstall cleanup receipt" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
              '```json' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
              Get-Content -LiteralPath runtime-evidence\uninstall-cleanup-last.json |
                Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
              '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            }
            if (Test-Path -LiteralPath runtime-evidence\uninstall-cleanup-last.stderr.log) {
              "### Deferred uninstall cleanup stderr" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
              '```text' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
              Get-Content -LiteralPath runtime-evidence\uninstall-cleanup-last.stderr.log |
                Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
              '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            }
            if (Test-Path -LiteralPath runtime-evidence\uninstall-attestation-listener-job.json) {
              "### Uninstall attestation listener" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
              '```json' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
              Get-Content -LiteralPath runtime-evidence\uninstall-attestation-listener-job.json |
                Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
              '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            }
            if (Test-Path -LiteralPath runtime-evidence\uninstall-attestation-attempts.json) {
              "### Uninstall attestation attempts" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
              '```json' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
              Get-Content -LiteralPath runtime-evidence\uninstall-attestation-attempts.json |
                Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
              '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            }
          } else {
            "Lifecycle did not reach a passing summary. Inspect the failed step and service diagnostics in this job log." |
              Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }
          foreach ($diagnostic in @(
              'uninstall-finalizers-this-run.json',
              'uninstall-finalizer-state.json',
              'native-failure-receipt.txt',
              'native-failure-receipt-tmp.txt',
              'uninstall-install-root-residual.json',
              'uninstall-install-processes.json',
              'uninstall-service.txt',
              'uninstall-tasks.txt',
              'uninstall-diagnostics-errors.json'
            )) {
            $diagnosticPath = Join-Path 'runtime-evidence' $diagnostic
            if (Test-Path -LiteralPath $diagnosticPath) {
              "### Uninstall diagnostic: $diagnostic" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
              '```text' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
              Get-Content -LiteralPath $diagnosticPath -TotalCount 120 | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
              '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            }
          }
          [int]$expectedRounds = 0
          try { $expectedRounds = [int]$env:NATIVE_REPEAT_COUNT } catch {
            "Unable to parse expected native round count: $($_.Exception.Message)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }
          $roundDirectories = @()
          try {
            if (Test-Path -LiteralPath runtime-evidence) {
              $roundDirectories = @(Get-ChildItem -LiteralPath runtime-evidence -Directory -Filter 'round-*' -ErrorAction Stop | Sort-Object Name)
            }
          } catch {
            "Unable to enumerate native lifecycle round evidence: $($_.Exception.Message)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }
          $actualSummaryCount = if (Test-Path -LiteralPath runtime-evidence\summary.json) { 1 } else { 0 }
          foreach ($roundDirectory in $roundDirectories) {
            $roundSummary = Join-Path $roundDirectory.FullName 'summary.json'
            if (Test-Path -LiteralPath $roundSummary) { $actualSummaryCount++ }
          }
          "Native runtime rounds: expected=$expectedRounds actual_summaries=$actualSummaryCount" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          foreach ($roundDirectory in $roundDirectories) {
            "## Native runtime lifecycle $($roundDirectory.Name)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            try {
              $roundSummary = Join-Path $roundDirectory.FullName 'summary.json'
              if (Test-Path -LiteralPath $roundSummary) {
                '```json' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
                Get-Content -LiteralPath $roundSummary -ErrorAction Stop | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
                '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
              } else {
                'No summary.json was produced for this round.' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
              }
              foreach ($diagnostic in @(
                  'uninstall-finalizers-this-run.json',
                  'uninstall-finalizer-state.json',
                  'native-failure-receipt.txt',
                  'native-failure-receipt-tmp.txt',
                  'uninstall-install-root-residual.json',
                  'uninstall-install-processes.json',
                  'uninstall-service.txt',
                  'uninstall-tasks.txt',
                  'uninstall-diagnostics-errors.json'
                )) {
                $diagnosticPath = Join-Path $roundDirectory.FullName $diagnostic
                if (Test-Path -LiteralPath $diagnosticPath) {
                  "### $($roundDirectory.Name) diagnostic: $diagnostic" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
                  '```text' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
                  Get-Content -LiteralPath $diagnosticPath -TotalCount 120 -ErrorAction Stop | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
                  '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
                }
              }
            } catch {
              "Unable to collect $($roundDirectory.Name) evidence: $($_.Exception.Message)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            }
          }

      - name: Upload Windows lifecycle evidence
        if: always() && inputs.evidence_transport == 'actions'
        uses: actions/upload-artifact@v4
        with:
          name: windows-lifecycle-evidence-${{ matrix.arch }}
          path: |
            setup-exe-evidence
            runtime-evidence
          if-no-files-found: warn
          retention-days: 7

      - name: Retain complete lifecycle evidence in private Release
        if: always() && inputs.evidence_transport == 'release'
        timeout-minutes: 10
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.USB_SIGNING_RELEASE_TOKEN }}
          LIFECYCLE_TARGET_TAG: ${{ inputs.target_tag }}
          LIFECYCLE_JOB_STATUS: ${{ job.status }}
        run: |
          $destination = Join-Path $env:RUNNER_TEMP "lifecycle-evidence-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT-${{ matrix.arch }}"
          & python .\scripts\upload_windows_lifecycle_evidence.py `
            --target-tag $env:LIFECYCLE_TARGET_TAG --arch '${{ matrix.arch }}' `
            --job-status $env:LIFECYCLE_JOB_STATUS --output-dir $destination
          if ($LASTEXITCODE -ne 0) { throw 'Private lifecycle evidence retention failed; inspect this job log; no evidence was published publicly' }
